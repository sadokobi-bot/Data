<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן סימולציה מתקדם: מדע הנתונים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --dark-bg: #0b0f19;
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--dark-bg);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background Particles */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.15);
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Deep Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 1.5rem;
            z-index: 10;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Smooth Animations */
        .fade-enter { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Interactive Options */
        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(14, 165, 233, 0.4);
            transform: translateX(-5px);
            box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
        }
        
        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: #10b981 !important;
            color: #34d399;
        }
        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #f87171;
        }
        
        .option-btn:disabled { cursor: default; }

        .progress-glow {
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- CSS Particles -->
    <div class="particles" id="particles-js"></div>

    <div id="app" class="max-w-4xl w-full glass-card overflow-hidden">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="p-10 sm:p-20 text-center fade-enter">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-sky-500/20 to-indigo-500/20 border border-sky-500/30 mb-8 shadow-[0_0_30px_rgba(14,165,233,0.3)]">
                <i class="fa-solid fa-brain text-5xl text-sky-400"></i>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black mb-6 tracking-tight bg-clip-text text-transparent bg-gradient-to-l from-sky-300 via-indigo-300 to-sky-300">
                מבחן האתגר: מדע הנתונים
            </h1>
            <p class="text-slate-300 text-lg mb-10 max-w-2xl mx-auto leading-relaxed font-light">
                65 שאלות פרקטיות ומתחכמות. ללא "התשובה הארוכה היא הנכונה". 
                מוכנים לבדוק את השליטה שלכם ב-Pandas, מודלים, מטריקות וניקוי נתונים באמת?
            </p>
            <button onclick="startQuiz()" class="relative inline-flex items-center px-10 py-4 bg-gradient-to-r from-sky-500 to-indigo-600 rounded-full font-bold text-lg text-white hover:from-sky-400 hover:to-indigo-500 transition-all shadow-[0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_0_40px_rgba(99,102,241,0.6)] hover:scale-105">
                <i class="fa-solid fa-rocket mr-3 ml-2"></i> בואו נתחיל
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden flex flex-col min-h-[600px]">
            
            <!-- Header -->
            <div class="px-6 py-5 border-b border-white/5 bg-white/5 flex justify-between items-center backdrop-blur-md">
                <div class="flex items-center gap-3 text-sky-400 font-medium">
                    <div class="bg-sky-500/20 p-2 rounded-lg">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <span>שאלה <span id="current-q-num" class="text-white font-bold">1</span> / 65</span>
                </div>
                <div class="flex items-center gap-2 bg-indigo-500/20 px-4 py-2 rounded-full text-indigo-300 border border-indigo-500/30">
                    <i class="fa-solid fa-star"></i>
                    <span id="score-display" class="font-bold text-white">0</span> נק'
                </div>
            </div>
            
            <!-- Progress -->
            <div class="h-1.5 w-full bg-slate-800">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-400 to-indigo-500 progress-glow transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Question -->
            <div class="p-6 sm:p-10 flex-grow flex flex-col">
                <h2 id="question-text" class="text-2xl sm:text-3xl font-bold leading-snug mb-8 text-slate-100"></h2>
                
                <div id="options-container" class="space-y-3 w-full">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Area -->
                <div id="feedback-area" class="hidden mt-8 p-5 sm:p-6 rounded-2xl border border-white/10 bg-white/5 fade-enter">
                    <div class="flex items-center gap-3 mb-3">
                        <i id="feedback-icon" class="text-2xl"></i>
                        <h3 id="feedback-title" class="text-xl font-bold"></h3>
                    </div>
                    <p id="feedback-rationale" class="text-slate-300 text-sm sm:text-base leading-relaxed"></p>
                    
                    <button id="next-btn" onclick="nextQuestion()" class="mt-6 w-full py-4 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl font-medium transition-all text-white flex items-center justify-center gap-2">
                        המשך לשאלה הבאה <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="result-screen" class="hidden p-10 sm:p-20 text-center fade-enter">
            <div id="result-icon-container" class="inline-flex p-6 rounded-full mb-6 border-4 shadow-2xl">
                <i id="result-icon" class="text-6xl"></i>
            </div>
            <h2 id="result-title" class="text-3xl sm:text-4xl font-black mb-4 text-white"></h2>
            <p id="result-subtitle" class="text-lg text-slate-400 mb-8"></p>
            
            <div class="relative inline-block mb-12">
                <svg class="w-40 h-40 transform -rotate-90">
                    <circle cx="80" cy="80" r="70" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="none" />
                    <circle id="score-circle" cx="80" cy="80" r="70" stroke="url(#gradient)" stroke-width="12" fill="none" stroke-dasharray="440" stroke-dashoffset="440" class="transition-all duration-1000 ease-out" />
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#818cf8" />
                        </linearGradient>
                    </defs>
                </svg>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl font-black text-white">
                    <span id="final-percentage">0</span>%
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="shareResults()" class="px-8 py-4 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white rounded-xl font-bold transition-all shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> שתף תוצאה
                </button>
                <button onclick="location.reload()" class="px-8 py-4 bg-white/10 hover:bg-white/20 border border-white/10 text-white rounded-xl font-medium transition-all flex justify-center items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> מבחן חוזר
                </button>
            </div>
            <p id="share-toast" class="text-emerald-400 mt-4 text-sm font-medium h-5 opacity-0 transition-opacity">הטקסט הועתק ללוח!</p>
        </div>
    </div>

    <script>
        // Generate simple particles for background
        const particlesContainer = document.getElementById('particles-js');
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 15 + 5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDelay = `${Math.random() * 15}s`;
            p.style.animationDuration = `${Math.random() * 10 + 10}s`;
            particlesContainer.appendChild(p);
        }

        // 65 HIGH-QUALITY EXAM QUESTIONS
        const questions = [
            // --- PANDAS BASICS & VIEWING (10) ---
            {
                q: "יש לנו טבלה בשם df. הפעלנו את הפקודה len(df.columns) וקיבלנו 5. הפעלנו את len(df) וקיבלנו 100. מה תחזיר הפקודה df.shape?",
                options: ["[100, 5]", "(100, 5)", "{100: 5}", "(5, 100)"],
                answer: 1,
                rationale: "התכונה shape מחזירה אובייקט מסוג Tuple (סוגריים עגולים) כאשר הערך הראשון הוא תמיד מספר השורות והשני הוא מספר העמודות."
            },
            {
                q: "אנו רוצים להציג את 3 השורות האחרונות בטבלה. איזו מבין הפקודות הבאות תבצע זאת בצורה הנכונה ביותר?",
                options: ["df.bottom(3)", "df.last(3)", "df.iloc[-3:]", "df.tail(3)"],
                answer: 3,
                rationale: "הפונקציה המובנית והפשוטה ביותר בפנדס להצגת סוף הטבלה היא tail(). שימוש ב-iloc[-3:] יעבוד גם הוא, אך tail היא התשובה המקובלת והקריאה ביותר."
            },
            {
                q: "מהו ההבדל המרכזי בין הפקודה df['Salary'] לבין הפקודה df[['Salary']]?",
                options: ["הראשונה מחזירה אובייקט מסוג Series, והשנייה מחזירה אובייקט מסוג DataFrame.", "הראשונה שולפת שורה, והשנייה שולפת עמודה.", "אין שום הבדל, שתיהן עושות בדיוק את אותו הדבר.", "הראשונה מציגה נתונים טקסטואליים, והשנייה נתונים מספריים."],
                answer: 0,
                rationale: "סוגריים מרובעים בודדים שולפים עמודה כסדרה חד-ממדית (Series). סוגריים כפולים שולפים את הנתונים כמבנה של טבלה דו-ממדית (DataFrame)."
            },
            {
                q: "הפקודה df.describe() מציגה כברירת מחדל סטטיסטיקה רק לעמודות מספריות. כיצד נאלץ אותה להציג מידע (כמו ערך שכיח וכמות ייחודיים) גם לעמודות טקסטואליות?",
                options: ["df.describe(all=True)", "df.describe(include='all')", "df.describe(type='object')", "df.describe(text=True)"],
                answer: 1,
                rationale: "הפרמטר include='all' אומר לפונקציה לא להתעלם מעמודות שאינן נומריות (Object), ומציג עבורן נתונים כמו top (הערך השכיח) ו-freq."
            },
            {
                q: "קראנו קובץ CSV, ואנו רוצים לוודא שהאינדקס מתחיל מ-0 ומסודר מחדש, מבלי להוסיף את האינדקס הישן כעמודה בטבלה. מהי הפקודה?",
                options: ["df.reset_index()", "df.set_index(drop=True)", "df.reset_index(drop=True)", "df.clear_index()"],
                answer: 2,
                rationale: "הפונקציה reset_index מסדרת את המספור מחדש. הפרמטר drop=True מוודא שהאינדקס הישן והמבולגן פשוט יימחק ולא יהפוך לעמודה חדשה."
            },
            {
                q: "מה יקרה אם נפעיל את הפקודה: pd.to_numeric(df['Price'], errors='coerce') על עמודה שמכילה את הערך 'Unknown'?",
                options: ["המערכת תעצור את הריצה ותזרוק שגיאת ValueError.", "המערכת תמיר את המילה 'Unknown' לערך 0 באופן אוטומטי.", "המערכת תתעלם מהשגיאה, תשאיר את המילה 'Unknown', ותמשיך הלאה.", "המערכת תמיר את המילה 'Unknown' לערך החסר התקני - NaN."],
                answer: 3,
                rationale: "זהו כלי חובה בניקוי נתונים. errors='coerce' מכריח את פנדס לא לקרוס, אלא להפוך כל טקסט שאינו בר המרה למספר, פשוט ל-NaN."
            },
            {
                q: "אנו מעוניינים להמיר את עמודת 'City' מטיפוס Object לטיפוס 'category'. מדוע שנעשה זאת?",
                options: ["כדי שנוכל להפעיל עליה חישובים אריתמטיים כמו ממוצע.", "כדי לחסוך בזיכרון המחשב ולייעל ביצועים, במיוחד כשיש מעט ערכים ייחודיים החוזרים על עצמם.", "כדי שפונקציית dropna לא תמחק ממנה ערכים חסרים בטעות.", "כדי להמיר אוטומטית טקסטים למספרים לקראת אימון מודל רגרסיה."],
                answer: 1,
                rationale: "סוג הנתונים Category שומר במערכת כל מילה רק פעם אחת (מילון פנימי), מה שחוסך המון זיכרון ומאיץ שאילתות ביחס לטיפוס Object."
            },
            {
                q: "ברצוננו לדעת כמה שורות *כפולות לחלוטין* קיימות בטבלה. מהי הפקודה הקצרה והנכונה?",
                options: ["df.duplicated().sum()", "df.count_duplicates()", "len(df.duplicates())", "df.isnull().sum()"],
                answer: 0,
                rationale: "הפקודה duplicated() מחזירה Series בוליאני (True לכפילויות). הפעלת sum() על סדרה בוליאנית סופרת את כמות ה-True."
            },
            {
                q: "יש לנו טבלה המכילה רשומות כפולות. כיצד נמחק את הכפילויות, אך נדאג לשמור דווקא את *ההופעה האחרונה* של כל רשומה כפולה במקום את הראשונה?",
                options: ["df.drop_duplicates(keep='last')", "df.drop_duplicates(tail=True)", "df.remove_duplicates(keep=-1)", "df.drop_duplicates(first=False)"],
                answer: 0,
                rationale: "לפונקציה drop_duplicates יש פרמטר בשם keep. ברירת המחדל היא 'first', אך העברת 'last' תגרום לשמירת הרשומה האחרונה בסדר."
            },
            {
                q: "מהי הדרך המהירה ביותר להחליף את כל המופעים של המילה 'Yes' ב-1, ואת 'No' ב-0 בעמודה מסוימת?",
                options: ["df['col'].apply('Yes': 1, 'No': 0)", "df['col'].map({'Yes': 1, 'No': 0})", "df['col'].change('Yes', 1).change('No', 0)", "df['col'].update('Yes', 1)"],
                answer: 1,
                rationale: "הפונקציה map מקבלת מילון ומחליפה כל ערך תואם בעמודה בערך החדש שהוגדר עבורו. זהו פתרון קלאסי ונקי מאוד בקידוד נתונים."
            },

            // --- FILTERING, LOC/ILOC (7) ---
            {
                q: "יש לנו טבלה בשם df. ברצוננו לשלוף את *השורה האחרונה בהחלט*. איזו פקודה תבצע זאת בצורה הבטוחה ביותר ללא תלות בסוג האינדקס?",
                options: ["df.loc[-1]", "df.iloc[-1]", "df[-1:]", "df.last()"],
                answer: 1,
                rationale: "iloc מבוסס על מיקום פיזי. בפייתון, אינדקס מינוס 1 תמיד מסמן את האיבר האחרון, ללא קשר לשם התווית של השורה."
            },
            {
                q: "ברצוננו לשלוף אך ורק את *העמודה האחרונה* בטבלה, עבור כל השורות. כיצד נעשה זאת עם iloc?",
                options: ["df.iloc[-1, :]", "df.iloc[:, -1]", "df.iloc[-1]", "df.iloc[[-1]]"],
                answer: 1,
                rationale: "המבנה של iloc הוא [שורות, עמודות]. הנקודתיים (:) בחלק הראשון אומרות 'כל השורות', והמינוס 1 בחלק השני אומר 'העמודה האחרונה'."
            },
            {
                q: "כיצד נסנן מתוך טבלה את כל השורות שבהן עמודת ה-'City' שווה ל-'Tel Aviv' **או** 'Haifa' בצורה האלגנטית ביותר?",
                options: ["df[df['City'] == 'Tel Aviv' | 'Haifa']", "df[df['City'].isin(['Tel Aviv', 'Haifa'])]", "df.filter(City == ['Tel Aviv', 'Haifa'])", "df.loc['City' = 'Tel Aviv' or 'Haifa']"],
                answer: 1,
                rationale: "הפונקציה isin() מקבלת רשימה של ערכים ומחזירה True עבור כל שורה שהערך בעמודה שלה תואם לאחד מהערכים ברשימה."
            },
            {
                q: "השתמשנו בסימן הטילדה (~) בסינון: df[~df['Age'].isna()]. מה תהיה התוצאה?",
                options: ["נקבל שגיאת סינטקס.", "נקבל רק את השורות שבהן הגיל חסר (NaN).", "נקבל רק את השורות שבהן הגיל **אינו** חסר.", "הטילדה תמיר את כל הערכים החסרים ל-0."],
                answer: 2,
                rationale: "בפנדס (וב-NumPy), סימן ה-~ משמש כאופרטור לשלילה לוגית (NOT). הוא פשוט הופך כל True ל-False ולהפך."
            },
            {
                q: "האינדקס בטבלה שלנו מורכב ממחרוזות (למשל 'Row_A', 'Row_B'). מה יקרה אם נפעיל את הפקודה df.loc[0]?",
                options: ["תשלוף את השורה הראשונה.", "תשלוף את העמודה הראשונה.", "תזרוק שגיאת KeyError.", "תאפס את האינדקס."],
                answer: 2,
                rationale: "מכיוון ש-loc עובד לפי *תוויות* (Labels), הוא יחפש תווית ששמה הוא המספר 0. מכיוון שהתוויות הן מחרוזות, הוא לא ימצא ויקרוס. (כדי לשלוף שורה ראשונה היינו צריכים iloc)."
            },

        function loadQuestion() {
            hasAnswered = false;
            const q = shuffledQuestions[currentQuestionIndex];
            
            // Animation reset
            questionText.style.animation = 'none';
            questionText.offsetHeight; 
            questionText.style.animation = 'fadeIn 0.4s ease-out forwards';
            
            questionText.textContent = `${q.q}`;
            questionCounter.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / shuffledQuestions.length) * 100}%`;
            
            optionsContainer.innerHTML = '';
            feedbackContainer.classList.add('hidden');
            feedbackContainer.classList.remove('bg-emerald-500/10', 'border-emerald-500/30', 'bg-red-500/10', 'border-red-500/30');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 sm:p-5 rounded-2xl text-lg text-slate-200 focus:outline-none flex justify-between items-center group font-medium text-right mb-3';

                    <div class="w-7 h-7 rounded-full border border-white/20 flex-shrink-0 flex items-center justify-center transition-all option-circle bg-white/5 group-hover:bg-white/10"></div>
                `;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = shuffledQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.answer;
            const allBtns = optionsContainer.children;

            for(let i=0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                const circle = allBtns[i].querySelector('.option-circle');
                
                if(i === q.answer) {

                } else if(i === selectedIndex && !isCorrect) {
                    allBtns[i].classList.add('incorrect');
                    circle.innerHTML = '<i class="fa-solid fa-xmark text-sm text-red-400"></i>';
                    circle.className = "w-7 h-7 rounded-full bg-red-500/20 border-red-500 flex-shrink-0 flex items-center justify-center";
                } else {
                    allBtns[i].classList.add('opacity-40');
                }
            }

            feedbackContainer.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            
            if(isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                feedbackContainer.classList.add('bg-emerald-500/10', 'border-emerald-500/30');
                feedbackTitle.textContent = "בול!";
                feedbackTitle.className = "text-xl font-bold text-emerald-400";
                feedbackIcon.className = "fa-solid fa-circle-check text-emerald-400 text-2xl";
            } else {
                feedbackContainer.classList.add('bg-red-500/10', 'border-red-500/30');
                feedbackTitle.textContent = "לא מדויק...";
                feedbackTitle.className = "text-xl font-bold text-red-400";
                feedbackIcon.className = "fa-solid fa-circle-xmark text-red-400 text-2xl";
            }

            feedbackRationale.innerHTML = `<span class="font-bold text-white drop-shadow-md">הסבר: </span>${q.rationale}`;
            
            if(currentQuestionIndex === shuffledQuestions.length - 1) {
                nextBtn.innerHTML = 'סיום וצפייה בתוצאות <i class="fa-solid fa-flag-checkered mr-2 text-xl"></i>';
                nextBtn.className = "mt-6 w-full py-5 bg-gradient-to-r from-sky-500 to-indigo-600 rounded-xl font-bold transition-all text-white flex items-center justify-center gap-2 shadow-lg hover:shadow-sky-500/50 hover:scale-[1.02] text-xl tracking-wide";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            progressBar.style.width = '100%';
            
            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            
            // Animate percentage circle
            setTimeout(() => {
                const circle = document.getElementById('score-circle');
                const offset = 440 - (440 * percentage) / 100;
                circle.style.strokeDashoffset = offset;
            }, 100);

            // Animate numbers
            let currentNum = 0;
            const targetNum = percentage;
            const numElement = document.getElementById('final-percentage');
            const interval = setInterval(() => {
                if (currentNum >= targetNum) {
                    clearInterval(interval);
                    numElement.textContent = targetNum;
                } else {
                    currentNum++;
                    numElement.textContent = currentNum;
                }
            }, 20);

            
            const title = document.getElementById('result-title');
            const subtitle = document.getElementById('result-subtitle');
            const icon = document.getElementById('result-icon');
            const iconCont = document.getElementById('result-icon-container');

            if(percentage >= 90) {
                title.innerHTML = 'Data Scientist <span class="text-sky-400">Pro</span>';
                subtitle.textContent = `ציון של ${score} מתוך ${shuffledQuestions.length}. אתה מכונה! המבחן הזה קטן עליך.`;
                icon.className = "fa-solid fa-user-astronaut text-sky-400 drop-shadow-[0_0_15px_rgba(56,189,248,0.8)]";
                iconCont.className = "inline-flex p-6 rounded-full mb-6 border-4 border-sky-400/30 bg-sky-400/10";
            } else if(percentage >= 75) {
                title.textContent = "עבודה חזקה מאוד!";
                subtitle.textContent = `השגת ${score} מתוך ${shuffledQuestions.length}. השליטה שלך בחומר מרשימה. מעבר זריז על הטעויות ואתה מסודר.`;
                icon.className = "fa-solid fa-rocket text-indigo-400 drop-shadow-[0_0_15px_rgba(129,140,248,0.8)]";
                iconCont.className = "inline-flex p-6 rounded-full mb-6 border-4 border-indigo-400/30 bg-indigo-400/10";
            } else if(percentage >= 60) {
                title.textContent = "כמעט שם...";
                subtitle.textContent = `ציון ${score}/${shuffledQuestions.length}. מעבר, אבל השאלות המכשילות הפילו אותך. עיין שוב בסיכומים לפני המבחן.`;
                icon.className = "fa-solid fa-chart-line text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.8)]";
                iconCont.className = "inline-flex p-6 rounded-full mb-6 border-4 border-emerald-400/30 bg-emerald-400/10";
            } else {
                title.textContent = "שווה לעשות חזרה";
                subtitle.textContent = `הוצאת ${score}/${shuffledQuestions.length}. המבחן הזה בכוונה קשה, אבל זה בדיוק הזמן לתרגל שוב את החומר מההתחלה.`;
                icon.className = "fa-solid fa-triangle-exclamation text-red-400 drop-shadow-[0_0_15px_rgba(248,113,113,0.8)]";
                iconCont.className = "inline-flex p-6 rounded-full mb-6 border-4 border-red-400/30 bg-red-400/10";
            }
        }

        function shareResults() {
            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            const text = `שרדתי את מבחן האתגר של מדע הנתונים! 🚀\nסיימתי עם ${score}/${shuffledQuestions.length} שאלות (${percentage}%).\nמי אמר פנדס ולא קיבל?`;
            
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('share-toast');
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 3000);
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    const toast = document.getElementById('share-toast');
                    toast.classList.remove('opacity-0');
                    setTimeout(() => toast.classList.add('opacity-0'), 3000);
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            });
        }
    </script>
</body>
</html>
