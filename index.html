<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן פלטים: סטטיסטיקה יישומית (SPSS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #0ea5e9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: var(--primary);
            background: linear-gradient(90deg, var(--primary-dark) 0%, var(--secondary) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 40px;
        }

        .app-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .app-header p {
            margin: 0;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 0 20px 50px;
        }

        .progress-bar-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .progress-track {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            animation: slideUp 0.5s ease-out;
            margin-bottom: 30px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: right;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .option-btn.correct {
            background: var(--success-light);
            border-color: var(--success);
            color: #065f46;
        }

        .option-btn.wrong {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #991b1b;
        }

        .option-btn:disabled {
            cursor: default;
            transform: none;
        }

        .feedback-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            animation: slideUp 0.4s ease-out;
        }

        .feedback-box h4 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-box p {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .feedback-box p:last-child {
            margin-bottom: 0;
        }

        .feedback-box.correct-feedback {
            display: block;
            background: var(--success-light);
            border-right: 5px solid var(--success);
            color: #065f46;
        }

        .feedback-box.wrong-feedback {
            display: block;
            background: var(--danger-light);
            border-right: 5px solid var(--danger);
            color: #991b1b;
        }

        .spss-table-wrapper {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            margin: 20px 0;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .spss-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #000;
        }

        .spss-table th, .spss-table td {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }

        .spss-table th {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            background: #f8fafc;
            font-weight: bold;
        }

        .spss-table tbody tr:last-child td {
            border-bottom: 2px solid #000;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-next {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-next:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        #resultsScreen {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
            border: 8px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            .question-text { font-size: 1.2rem; }
            .option-btn { font-size: 1rem; padding: 15px; }
            .spss-table { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>הכנה למבחן: ניתוח פלטים ב-SPSS</h1>
        <p>תרגול ממוקד - קבלת החלטות וזיהוי מבחנים</p>
    </div>

    <div class="container">
        
        <!-- Quiz Section -->
        <div id="quizScreen">
            <div class="progress-bar-container">
                <div class="progress-info">
                    <span>שאלה <span id="currentQNum">1</span> מתוך <span id="totalQNum">30</span></span>
                    <span id="scoreTracker">ציון: 0</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="card" id="questionCard">
                <div class="question-text" id="questionText">טוען שאלה...</div>
                <div id="tableContainer"></div>
                
                <div class="options-grid" id="optionsGrid">
                    <!-- Options injected via JS -->
                </div>

                <div id="feedbackBox" class="feedback-box">
                    <!-- Feedback injected via JS -->
                </div>

                <div class="action-container">
                    <button class="btn-next" id="btnNext" onclick="nextQuestion()">השאלה הבאה ❯</button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsScreen" class="card">
            <h2>סיום המבחן!</h2>
            <div class="score-circle" id="finalScore">0%</div>
            <h3 id="finalMessage" style="font-size: 1.5rem; margin-bottom: 30px;"></h3>
            <button class="btn-next" style="display: inline-block;" onclick="location.reload()">תרגל שוב מהתחלה</button>
        </div>

    </div>

    <script>
        const questions = [
            // --- TOPIC: RULES & BASICS ---
            {
                q: "מהו הכלל המרכזי והחשוב ביותר לדחיית השערת האפס (H0) בכל פלט סטטיסטי של SPSS?",
                table: "",
                options: [
                    "כאשר ערך ה- Sig גדול מ- 0.05",
                    "כאשר ערך ה- Sig קטן מ- 0.05",
                    "כאשר מבחן T חיובי",
                    "כאשר ערך ה- Beta קרוב ל- 1"
                ],
                ans: 1,
                exp: "חוק הברזל: תמיד דוחים את H0 (ומסיקים שהמודל/הקשר/ההבדל מובהק) כאשר ה-Sig (רמת המובהקות) קטן מ-0.05."
            },
            
            // --- TOPIC: RELIABILITY ---
            {
                q: "חוקר בנה שאלון עם 6 שאלות שנועדו לבדוק 'רמת מוטיבציה'. באיזה מבחן ישתמש כדי לבדוק האם כל השאלות מודדות את אותו עולם תוכן בהצלחה?",
                table: "",
                options: [
                    "מבחן חי בריבוע",
                    "מבחן T למדגמים בלתי תלויים",
                    "מהימנות - אלפא של קרונבך (Cronbach's Alpha)",
                    "ניתוח שונות (ANOVA)"
                ],
                ans: 2,
                exp: "אלפא של קרונבך משמש לבדיקת עקיבות פנימית (מהימנות) של שאלון או מדד המורכב ממספר פריטים."
            },
            {
                q: "התבונן בפלט בדיקת המהימנות הבא. מה המסקנה הסטטיסטית לגבי השאלון?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>Cronbach's Alpha</th><th>N of Items</th></tr></thead>
                    <tbody><tr><td>.885</td><td>6</td></tr></tbody>
                </table>
                </div>
                `,
                options: [
                    "השאלון בעייתי, יש למחוק לפחות שאלה אחת.",
                    "השאלון מורכב מ-6 שאלות (פריטים) ורמת המהימנות שלו טובה מאוד.",
                    "המודל מסביר 88.5% מהשונות של המוטיבציה.",
                    "דוחים את השערת האפס כי הערך גדול מ-0.05."
                ],
                ans: 1,
                exp: "N of items = מספר השאלות הוא 6. ערך אלפא של 0.885 הוא גדול מ-0.7, ולכן המהימנות של השאלון טובה מאוד."
            },
            {
                q: "בטבלת Item-Total Statistics המציגה את פירוט השאלות, מה המשמעות אם בעמודת 'Cronbach's Alpha if item deleted' בשורה של שאלה מס' 2 מופיע הערך 0.910 (כאשר האלפא הכללית היא 0.820)?",
                table: "",
                options: [
                    "שאלה מס' 2 היא השאלה החשובה ביותר בשאלון, אסור למחוק אותה.",
                    "מחיקת שאלה מס' 2 תפגע במהימנות השאלון.",
                    "השאלה מנוסחת בצורה טובה ותורמת למדד.",
                    "מחיקת השאלה תעלה את מהימנות השאלון ل-0.910, ולכן היא 'פוגעת' בשאלון וכדאי לשקול להסירה."
                ],
                ans: 3,
                exp: "העמודה מראה מה תהיה רמת האמינות אם נזרוק את השאלה. אם המחיקה מעלה את האמינות (מ-0.820 ל-0.910), השאלה הזו בעייתית."
            },

            // --- TOPIC: CHI-SQUARE ---
            {
                q: "חוקר מעוניין לבדוק האם קיים קשר בין המשתנה 'מגדר' (גבר/אישה) לבין 'מעורבות בתאונת דרכים' (כן/לא). באיזה מבחן עליו להשתמש?",
                table: "",
                options: [
                    "מבחן T למדגמים בלתי תלויים",
                    "רגרסיה ליניארית",
                    "מבחן חי בריבוע (Chi-Square)",
                    "ניתוח שונות דו-כיווני"
                ],
                ans: 2,
                exp: "כאשר אנו רוצים לבדוק קשר בין שני משתנים קטגוריאליים/שמיים (מגדר ותאונה), המבחן המתאים הוא חי בריבוע."
            },
            {
                q: "התבונן בפלט חי בריבוע הבא. מה המסקנה הסטטיסטית?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th></th><th>Value</th><th>df</th><th>Asymp. Sig. (2-sided)</th></tr></thead>
                    <tbody><tr><td>Pearson Chi-Square</td><td>8.353</td><td>1</td><td>.004</td></tr></tbody>
                </table>
                </div>
                `,
                options: [
                    "לא דוחים את H0, מכיוון שה-Sig קטן מ-0.05.",
                    "דוחים את H0, מכיוון שה-Sig קטן מ-0.05, כלומר יש קשר מובהק בין המשתנים.",
                    "המבחן לא תקין כי ה-df שווה ל-1.",
                    "דוחים את H0 כי ה-Value גדול מ-5."
                ],
                ans: 1,
                exp: "ה- Asymp. Sig. הוא 0.004, שזה קטן מ-0.05. לכן דוחים H0 ומסיקים שיש קשר מובהק בין המשתנים הקטגוריאליים."
            },
            {
                q: "בתחתית טבלת Chi-Square Tests באחד המבחנים הופיעה ההערה הבאה:<br><code>a. 2 cells (33.3%) have expected count less than 5.</code><br>כיצד עליך להתייחס להערה זו?",
                table: "",
                options: [
                    "המבחן תקין לחלוטין ויש לקרוא את השורה של Pearson Chi-Square כרגיל.",
                    "המבחן מובהק כי 33.3% זה גדול מ-5%.",
                    "המבחן אינו תקין (יותר מ-20% מהתאים עם שכיחות צפויה קטנה מ-5), ולכן יש להסתכל על מבחן פישר (Fisher's Exact Test).",
                    "דוחים את השערת האפס בגלל ההערה."
                ],
                ans: 2,
                exp: "התנאי לתקינות חי בריבוע הוא שלכל היותר 20% מהתאים יהיו עם תוחלת קטנה מ-5. כאן קיבלנו 33.3% ולכן המבחן הופר."
            },

            // --- STREAMING_CHUNK: TOPIC: REGRESSION ---
            {
                q: "חוקר מעוניין *לנבא* את השכר (משתנה כמותי) על סמך 2 משתנים מסבירים: רמת השכלה ושכר התחלתי. באיזה מבחן ישתמש?",
                table: "",
                options: [
                    "ניתוח שונות דו-כיווני",
                    "מבחן חי בריבוע",
                    "רגרסיה ליניארית מרובה (Multiple Regression)",
                    "מבחן T למדגמים בלתי תלויים"
                ],
                ans: 2,
                exp: "ניבוי של משתנה כמותי על סמך משתנים כמותיים אחרים (2 ומעלה) דורש רגרסיה ליניארית מרובה."
            },
            {
                q: "התבונן בטבלת 'Model Summary' מפלט רגרסיה. מה פירוש המספר המודגש?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>Model</th><th>R</th><th>R Square</th><th>Adjusted R Square</th></tr></thead>
                    <tbody><tr><td>1</td><td>.873</td><td><b>.762</b></td><td>.761</td></tr></tbody>
                </table>
                </div>
                `,
                options: [
                    "המודל מובהק סטטיסטית ברמה של 76.2%.",
                    "המודל מסביר 76.2% מהשונות של המשתנה התלוי (Y).",
                    "המנבא החזק ביותר במודל משפיע בעוצמה של 0.762.",
                    "ישנה טעות של 76.2% בניבוי."
                ],
                ans: 1,
                exp: "ערך ה- R Square ($R^2$) מייצג את אחוז השונות ב-Y שמוסברת על ידי המשתנים הבלתי תלויים (X). כאן זה 76.2%."
            },
            {
                q: "למה משמשת טבלת ה- ANOVA המופיעה תמיד *כחלק* מפלט של רגרסיה ליניארית?",
                table: "",
                options: [
                    "כדי להרכיב את משוואת הניבוי.",
                    "כדי להשוות ממוצעים בין גברים לנשים.",
                    "כדי לבדוק האם המודל כולו (הקשר הליניארי בין כל ה-X ל-Y) מובהק סטטיסטית.",
                    "כדי לבדוק מהימנות שאלונים."
                ],
                ans: 2,
                exp: "בתוך רגרסיה, תפקידה של טבלת ה-ANOVA הוא אך ורק להראות לנו דרך ה-Sig האם מודל הניבוי כולו תקף ומובהק."
            },
            {
                q: "בטבלת המקדמים (Coefficients) ברגרסיה מרובה, לאיזו עמודה נסתכל כדי לדעת איזה משתנה מנבא הוא *המשפיע והחזק ביותר*?",
                table: "",
                options: [
                    "B (Unstandardized Coefficients)",
                    "Sig",
                    "Beta (Standardized Coefficients)",
                    "t"
                ],
                ans: 2,
                exp: "כדי להשוות עוצמות השפעה בין משתנים שנמדדים ביחידות שונות, מסתכלים תמיד על ה-Beta (המקדם המתוקנן)."
            },
            {
                q: "התבונן בטבלת המקדמים. מי מהמשתנים המסבירים הוא המשפיע ביותר על 'השכר הנוכחי' (המשתנה התלוי), ומדוע?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>Model</th><th>Unstandardized B</th><th>Standardized Beta</th><th>Sig.</th></tr></thead>
                    <tbody>
                        <tr><td>(Constant)</td><td>-6335</td><td></td><td>.000</td></tr>
                        <tr><td>Educational Level</td><td>997</td><td>.195</td><td>.000</td></tr>
                        <tr><td>Beginning Salary</td><td>1.57</td><td>.732</td><td>.000</td></tr>
                    </tbody>
                </table>
                </div>
                `,
                options: [
                    "רמת השכלה, כי ה- B שלה (997) גדול מה-B של שכר התחלתי (1.57).",
                    "שכר התחלתי, כי ה- Beta שלו (0.732) גדול מה- Beta של השכלה (0.195).",
                    "שניהם משפיעים באותה מידה כי ה-Sig של שניהם הוא 0.000.",
                    "לא ניתן לדעת מטבלה זו."
                ],
                ans: 1,
                exp: "המשתנה שמשפיע הכי הרבה נקבע אך ורק לפי עמודת ה- Beta (בערך מוחלט). 0.732 > 0.195, לכן שכר התחלתי חזק יותר בניבוי."
            },

            // --- STREAMING_CHUNK: TOPIC: T-TESTS ---
            {
                q: "חוקר מעוניין לבדוק האם קיים הבדל במשך האשפוז (בימים) בין נפגעי תאונות דרכים לבין נפגעי פעולות איבה. באיזה מבחן ישתמש?",
                table: "",
                options: [
                    "מבחן T למדגמים תלויים (Paired)",
                    "ניתוח שונות חד-כיווני (ANOVA)",
                    "מבחן חי בריבוע",
                    "מבחן T למדגמים בלתי תלויים (Independent)"
                ],
                ans: 3,
                exp: "יש לנו משתנה תלוי כמותי (ימים) ומשתנה בלתי תלוי קטגוריאלי שמורכב מ-2 קבוצות שונות לגמרי. לכן נבחר ב-T בלתי תלויים."
            },
            {
                q: "חוקר שקל 30 מטופלים לפני תחילת דיאטה, ושקל את *אותם המטופלים* שוב לאחר חודש כדי לראות אם ירדו במשקל. באיזה מבחן ישתמש?",
                table: "",
                options: [
                    "מבחן T למדגמים בלתי תלויים",
                    "מבחן T למדגמים תלויים / מזווגים (Paired)",
                    "רגרסיה ליניארית",
                    "חי בריבוע"
                ],
                ans: 1,
                exp: "כאשר מודדים את אותם האנשים פעמיים (לפני ואחרי), הנתונים תלויים זה בזה. לכן נשתמש ב-T למדגמים תלויים."
            },
            {
                q: "התבונן בפלט מבחן T למדגמים בלתי תלויים. בחלק הראשון של הטבלה מופיע מבחן לווין (Levene's Test) לבדיקת שוויון שונויות עם הערך Sig = 0.237. כיצד יש לפעול?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th></th><th>Levene's Test - F</th><th>Levene's Test - Sig.</th></tr></thead>
                    <tbody>
                        <tr><td>Equal variances assumed</td><td>1.420</td><td>.237</td></tr>
                        <tr><td>Equal variances not assumed</td><td></td><td></td></tr>
                    </tbody>
                </table>
                </div>
                `,
                options: [
                    "כיוון ש-Sig > 0.05 במבחן לווין, מניחים שהשונויות שוות ויש לקרוא את תוצאת מבחן T בשורה העליונה (Equal variances assumed).",
                    "כיוון ש-Sig > 0.05, יש לקרוא את השורה התחתונה.",
                    "ה-T-test נכשל ואי אפשר להמשיך.",
                    "כיוון שה-Sig גדול מ-0.05 מסיקים שאין הבדל בין הממוצעים של הקבוצות וסיימנו."
                ],
                ans: 0,
                exp: "במבחן לווין (שבודק שונויות, לא ממוצעים!), Sig > 0.05 אומר שהשונויות שוות. לכן קוראים את מבחן ה-t בשורה העליונה."
            },
            {
                q: "התבונן בתוצאת מבחן T (למדגמים בלתי תלויים). מה המסקנה הסטטיסטית לגבי הבדל בממוצעים?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>t</th><th>df</th><th>Sig. (2-tailed)</th></tr></thead>
                    <tbody><tr><td>-2.841</td><td>18</td><td>.006</td></tr></tbody>
                </table>
                </div>
                `,
                options: [
                    "לא קיים הבדל מובהק בין הקבוצות.",
                    "קיים הבדל מובהק בין הקבוצות, מכיוון שה-Sig (0.006) קטן מ-0.05.",
                    "לא קיים הבדל כי ה-t שלילי.",
                    "דוחים את H0 כי דרגות החופש (18) זוגיות."
                ],
                ans: 1,
                exp: "מסתכלים על Sig. (2-tailed). מכיוון שהוא 0.006 (< 0.05), דוחים את השערת האפס ומסיקים שיש הבדל מובהק בממוצעים."
            },

            // --- STREAMING_CHUNK: TOPIC: ANOVA ---
            {
                q: "חוקר בודק את רמת האושר (משתנה כמותי 1-100) אצל תושבי 4 אזורים שונים בארץ. איזה מבחן עליו לבצע?",
                table: "",
                options: [
                    "מבחן חי בריבוע",
                    "מבחן T למדגמים בלתי תלויים",
                    "ניתוח שונות חד-כיווני (One-Way ANOVA)",
                    "ניתוח שונות דו-כיווני"
                ],
                ans: 2,
                exp: "השוואת ממוצעים בין 3 קבוצות או יותר (כאן יש 4 אזורים) מצריכה ניתוח שונות חד-כיווני (ANOVA)."
            },
            {
                q: "למה החוקר מהשאלה הקודמת לא מבצע פשוט 6 מבחני T נפרדים לכל זוג אזורים (צפון-מרכז, מרכז-דרום וכו')?",
                table: "",
                options: [
                    "כי תוכנת SPSS לא מאפשרת להריץ הרבה מבחני T במקביל.",
                    "כדי לא להגדיל את ההסתברות לטעות מסוג ראשון (דחיית H0 בטעות) שמצטברת מריבוי מבחנים.",
                    "כי מבחן T מיועד רק למדגמים תלויים.",
                    "כי זה יקטין את השונות המוסברת של המודל."
                ],
                ans: 1,
                exp: "כל מבחן T טומן סיכוי של 5% לטעות. ריבוי מבחנים במקביל מעלה דרסטית את הסיכוי לטעות מסוג ראשון. ANOVA פותרת זאת בבדיקה אחת."
            },
            {
                q: "התבונן בפלט ה-ANOVA הבא. מהו הצעד הבא שהחוקר צריך לבצע?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>Source</th><th>Sum of Squares</th><th>df</th><th>Mean Square</th><th>F</th><th>Sig.</th></tr></thead>
                    <tbody>
                        <tr><td>Between Groups</td><td>163.33</td><td>2</td><td>81.67</td><td>8.167</td><td>.003</td></tr>
                        <tr><td>Within Groups</td><td>120.00</td><td>12</td><td>10.00</td><td></td><td></td></tr>
                    </tbody>
                </table>
                </div>
                `,
                options: [
                    "ה-Sig קטן מ-0.05, לכן יש הבדל בין הקבוצות. כעת חובה לבצע מבחן Post Hoc (כמו מבחן Tukey) כדי למצוא אילו זוגות שונים זה מזה.",
                    "ה-Sig קטן מ-0.05, לכן המבחן נכשל ויש לעבור למבחן חי בריבוע.",
                    "ה-Sig קטן מ-0.05, לכן אין הבדל בין הקבוצות והניתוח מסתיים.",
                    "יש לחשב את משוואת הישר על סמך ה-F."
                ],
                ans: 0,
                exp: "מכיוון שיש הבדל מובהק ב-ANOVA (Sig < 0.05), אנו יודעים שקיים הבדל אך לא יודעים איפה. לכן עוברים למבחן השוואות זוגיות - פוסט-הוק."
            },
            {
                q: "אם בפלט ה-ANOVA הקודם ה-Sig היה יוצא 0.482. מה היה הצעד הבא?",
                table: "",
                options: [
                    "ביצוע מבחן פוסט-הוק מסוג טוקי.",
                    "ביצוע מבחן T לכל זוג בנפרד.",
                    "לא דוחים את H0 (אין הבדל מובהק בין הקבוצות). הניתוח מסתיים ואין טעם ב-Post Hoc.",
                    "דוחים את H0."
                ],
                ans: 2,
                exp: "אם ANOVA קובע שאין הבדל (Sig > 0.05), אנחנו עוצרים. אין שום סיבה לחפש מי שונה אם הוכחנו שכולם סטטיסטית זהים."
            },

            // --- STREAMING_CHUNK: TOPIC: TWO-WAY ANOVA ---
            {
                q: "חוקר בודק כיצד משפיעים המגדר (גבר/אישה) ורמת ההשכלה (תיכון/תואר 1) על השכר. איזה מבחן סטטיסטי מתאים?",
                table: "",
                options: [
                    "ניתוח שונות חד-כיווני",
                    "ניתוח שונות דו-כיווני (Two-Way ANOVA)",
                    "מבחן T למדגמים בלתי תלויים",
                    "רגרסיה פשוטה"
                ],
                ans: 1,
                exp: "כאשר מנבאים משתנה כמותי (שכר) בעזרת שני משתנים בלתי תלויים קטגוריאליים, משתמשים בניתוח שונות דו-כיווני."
            },
            {
                q: "בניתוח שונות דו-כיווני נבדקות 3 השערות: אפקט עיקרי למשתנה א', אפקט עיקרי למשתנה ב', ואפקט נוסף קריטי. מהו?",
                table: "",
                options: [
                    "אפקט פירסון",
                    "אפקט ההפרשים התלויים",
                    "אפקט הרגרסיה",
                    "אפקט האינטראקציה בין שני המשתנים (Interaction Effect)"
                ],
                ans: 3,
                exp: "היתרון הגדול של Two-Way ANOVA הוא היכולת לבדוק האם ההשפעה של משתנה אחד תלויה במשתנה השני (למשל: תואר משפיע על שכר, אבל אצל גברים יותר מאצל נשים)."
            },
            {
                q: "התבונן בפלט הבא מתוך ניתוח שונות דו-כיווני שבדק את השפעת מגדר והשכלה על שכר. האם קיימת אינטראקציה מובהקת?",
                table: `
                <div class="spss-table-wrapper">
                <table class="spss-table">
                    <thead><tr><th>Source</th><th>Sig.</th></tr></thead>
                    <tbody>
                        <tr><td>Gender</td><td>.002</td></tr>
                        <tr><td>Education</td><td>.007</td></tr>
                        <tr><td>Gender * Education</td><td>.047</td></tr>
                    </tbody>
                </table>
                </div>
                `,
                options: [
                    "לא, כי ה-Sig של המגדר קטן מ-0.05.",
                    "כן, מכיוון שה-Sig בשורת האינטראקציה (Gender * Education) שווה 0.047 וקטן מ-0.05.",
                    "לא, כי אין פה שורה של Between Groups.",
                    "אי אפשר לדעת."
                ],
                ans: 1,
                exp: "שורת האינטראקציה מסומנת על ידי כפל המשתנים (Gender * Education). מכיוון שה-Sig שלה < 0.05, קיימת אינטראקציה מובהקת."
            }
        ];

        // --- STREAMING_CHUNK: Handling Quiz Logic & State ---
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('questionText');
        const tableContainer = document.getElementById('tableContainer');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackBox = document.getElementById('feedbackBox');
        const btnNext = document.getElementById('btnNext');
        const currentQNum = document.getElementById('currentQNum');
        const totalQNum = document.getElementById('totalQNum');
        const progressFill = document.getElementById('progressFill');
        const scoreTracker = document.getElementById('scoreTracker');

        function initQuiz() {
            totalQNum.innerText = questions.length;
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];
            
            // Update UI
            currentQNum.innerText = currentQuestionIndex + 1;
            progressFill.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
            
            questionText.innerHTML = q.q;
            tableContainer.innerHTML = q.table ? q.table : '';
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';
            btnNext.innerText = currentQuestionIndex === questions.length - 1 ? 'סיום והצגת ציון' : 'השאלה הבאה ❯';

            // Render options
            optionsGrid.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<div style="flex-grow:1; text-align:right;">${opt}</div>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (answered) return; // Prevent multiple clicks
            answered = true;

            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.ans;
            const allBtns = optionsGrid.querySelectorAll('.option-btn');

            // Disable all buttons
            allBtns.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score++;
                scoreTracker.innerText = `ציון: ${score}`;
                btnElement.classList.add('correct');
                
                feedbackBox.className = 'feedback-box correct-feedback';
                feedbackBox.innerHTML = `
                    <h4><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> מעולה, תשובה נכונה!</h4>
                    <p>${q.exp}</p>
                `;
            } else {
                btnElement.classList.add('wrong');
                allBtns[q.ans].classList.add('correct'); // Highlight correct answer
                
                feedbackBox.className = 'feedback-box wrong-feedback';
                feedbackBox.innerHTML = `
                    <h4><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> טעות. שים לב:</h4>
                    <p>התשובה הנכונה היא: <strong>${q.options[q.ans]}</strong></p>
                    <p><strong>למה?</strong> ${q.exp}</p>
                `;
            }

            btnNext.style.display = 'inline-block';
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            const resultsScreen = document.getElementById('resultsScreen');
            resultsScreen.style.display = 'block';
            resultsScreen.style.animation = 'slideUp 0.5s ease-out';

            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').innerText = `${percent}%`;

            let msg = "";
            if (percent >= 90) msg = "תותח פלטים! אתה מוכן לחלוטין למבחן. 🏆";
            else if (percent >= 75) msg = "עבודה טובה מאוד! אתה שולט היטב בחומר. ✨";
            else if (percent >= 60) msg = "ציון עובר, אבל כדאי לעבור שוב על הטעויות (במיוחד מתי בוחרים באיזה מבחן). 👍";
            else msg = "אל ייאוש! קרא שוב את המדריך, שנן את חוק ה-Sig, ותעשה את המבחן מחדש. 💪";

            document.getElementById('finalMessage').innerText = msg;
        }

        // Start Quiz
        initQuiz();
    </script>
