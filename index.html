<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן סימולציה מקיף: מדע הנתונים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --dark-bg: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--dark-bg);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .option-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #34d399;
        }
        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #f87171;
        }
        
        .option-btn:disabled { cursor: default; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="max-w-4xl w-full glass-card overflow-hidden">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="p-10 sm:p-20 text-center fade-enter">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-sky-500/20 border border-sky-500/30 mb-8">
                <i class="fa-solid fa-laptop-code text-5xl text-sky-400"></i>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black mb-6 text-white">מבחן מסכם: מדע הנתונים</h1>
            <p class="text-slate-300 text-lg mb-10 max-w-2xl mx-auto">
                65 שאלות מדויקות התואמות לחומר הלימוד ולמיקוד המרצה. המבחן בודק קוד, הבנת מודלים, מטריקות הערכה וניקוי נתונים.
            </p>
            <button onclick="startQuiz()" class="px-10 py-4 bg-sky-500 hover:bg-sky-400 rounded-full font-bold text-lg text-white transition-all shadow-lg hover:scale-105">
                התחל מבחן עכשיו <i class="fa-solid fa-arrow-left mr-2"></i>
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden flex flex-col min-h-[600px]">
            <div class="px-6 py-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                <div class="text-sky-400 font-medium">שאלה <span id="current-q-num" class="text-white font-bold">1</span> / 65</div>
                <div class="text-slate-300"><span id="score-display" class="font-bold text-white">0</span> נקודות</div>
            </div>
            
            <div class="h-1 w-full bg-slate-800">
                <div id="progress-bar" class="h-full bg-sky-400 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="p-6 sm:p-10 flex-grow flex flex-col">
                <h2 id="question-text" class="text-2xl sm:text-3xl font-bold leading-snug mb-8 text-slate-100" dir="rtl"></h2>
                <div id="options-container" class="space-y-4 w-full"></div>

                <div id="feedback-area" class="hidden mt-8 p-5 rounded-xl border border-white/10 bg-white/5 fade-enter">
                    <h3 id="feedback-title" class="text-xl font-bold mb-2"></h3>
                    <p id="feedback-rationale" class="text-slate-300 text-sm sm:text-base leading-relaxed"></p>
                    <button id="next-btn" onclick="nextQuestion()" class="mt-6 w-full py-4 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl font-medium transition-all text-white">
                        לשאלה הבאה <i class="fa-solid fa-arrow-left mr-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="result-screen" class="hidden p-10 sm:p-20 text-center fade-enter">
            <h2 class="text-4xl font-black mb-4 text-white">תוצאות המבחן</h2>
            <div class="text-6xl font-black text-sky-400 mb-8 border-4 border-sky-400/30 inline-block p-10 rounded-full bg-sky-400/10">
                <span id="final-percentage">0</span>%
            </div>
            <p id="result-subtitle" class="text-xl text-slate-300 mb-10"></p>
            
            <button onclick="location.reload()" class="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition-all">
                <i class="fa-solid fa-rotate-right mr-2"></i> תרגל שוב
            </button>
        </div>
    </div>

    <script>
        const questions = [
            // CRISP-DM
            {
                q: "במודל CRISP-DM, איזה שלב מגיע מיד לאחר 'הבנת הבעיה העסקית' (Business Understanding)?",
                options: ["הערכת המודל (Evaluation).", "הטמעת המודל (Deployment).", "איסוף והבנת הנתונים (Data Understanding).", "הכנת הנתונים וניקויים (Data Preparation)."],
                answer: 2,
                rationale: "לאחר שמבינים מה הבעיה העסקית, השלב הבא הוא לאסוף את הנתונים הרלוונטיים ולהבין אותם, ורק לאחר מכן מכינים ומנקים אותם."
            },
            {
                q: "מהי מטרת השלב 'Deployment' במחזור החיים של פרויקט במדע הנתונים?",
                options: ["לנקות את הערכים החסרים בטבלאות המסד.", "לאמן את המודל על נתוני האימון.", "להטמיע את המודל המאומן במערכות הארגון לשימוש מבצעי.", "לפצל את הנתונים לקבוצת אימון וקבוצת בדיקה."],
                answer: 2,
                rationale: "Deployment (הטמעה) הוא השלב האחרון בו המודל יוצא ממעבדת הפיתוח ומשולב במוצר האמיתי של החברה."
            },
            
            // Pandas Creation & Basic
            {
                q: "הגדרנו מילון בשם data בפייתון. כיצד נייצר ממנו DataFrame חדש?",
                options: ["df = pd.DataFrame(data)", "df = pd.create_table(data)", "df = pd.NewDataFrame(data)", "df = pd.read_dict(data)"],
                answer: 0,
                rationale: "הפקודה DataFrame (עם אותיות גדולות D ו-F) של ספריית pandas מייצרת טבלה ממבני נתונים כמו מילון או רשימה."
            },
            {
                q: "מה ההבדל בין Series ל-DataFrame ב-Pandas?",
                options: ["Series מכיל רק טקסט, ו-DataFrame רק מספרים.", "Series הוא מבנה חד-ממדי (עמודה אחת), ו-DataFrame הוא מבנה דו-ממדי (טבלה).", "אין הבדל, אלו מילים נרדפות לאותו אובייקט.", "DataFrame יכול להכיל רק עמודה אחת מקסימום."],
                answer: 1,
                rationale: "Series הוא למעשה עמודה בודדת. DataFrame הוא אוסף של אובייקטי Series המרכיבים יחד טבלה שלמה."
            },
            {
                q: "ברצוננו לקבל מידע טכני על ה-DataFrame שלנו, כגון סוגי הנתונים (Dtypes) בכל עמודה וכמות הערכים שאינם חסרים. באיזו פקודה נשתמש?",
                options: ["df.describe()", "df.stats()", "df.info()", "df.dtypes()"],
                answer: 2,
                rationale: "הפונקציה info מציגה את 'תעודת הזהות' הטכנית של הטבלה. describe מציגה מידע סטטיסטי מתמטי."
            },
            {
                q: "הפעלנו את הפקודה df.describe(). אילו נתונים הפקודה מציגה כברירת מחדל?",
                options: ["סיכום סטטיסטי (ממוצע, סטיית תקן, מינימום) לעמודות המספריות בלבד.", "את רשימת כל הערכים החסרים בטבלה.", "את שמות העמודות ואת סוג הנתונים של כל עמודה.", "סיכום סטטיסטי לכל העמודות, כולל עמודות טקסט."],
                answer: 0,
                rationale: "כברירת מחדל, describe מתעלמת מעמודות טקסט ופועלת רק על עמודות נומריות. כדי לכלול טקסט יש להשתמש ב-include='all'."
            },
            
            // DataFrame manipulation (Rows/Cols)
            {
                q: "כיצד מוסיפים עמודה חדשה בשם 'Status' ומאתחלים אותה בערך 'Active' עבור כל השורות?",
                options: ["df.insert_column('Status', 'Active')", "df.add('Status', 'Active')", "df['Status'] = 'Active'", "df.append_col('Status' = 'Active')"],
                answer: 2,
                rationale: "בפנדס, הדרך ליצור עמודה חדשה היא פשוט לפנות לשם שאינו קיים בתוך סוגריים מרובעים ולהציב לתוכו ערך."
            },
            {
                q: "מה מבצעת הפקודה df = df.drop('Age', axis=1)?",
                options: ["מוחקת את השורה שהאינדקס שלה הוא 'Age'.", "מוחקת את העמודה 'Age' מהטבלה ושומרת את השינוי.", "ממירה את סוג הנתונים בעמודה 'Age' ל-0 או 1.", "ממיינת את הטבלה לפי עמודת 'Age' בסדר יורד."],
                answer: 1,
                rationale: "הפונקציה drop מוחקת, ו-axis=1 מורה לה שהמחיקה היא לאורך ציר העמודות. ההשמה (df=) שומרת את הטבלה החדשה."
            },
            {
                q: "ברצוננו לשנות את שמה של העמודה 'old_name' ל-'new_name'. מהו התחביר הנכון?",
                options: ["df.rename('old_name', 'new_name', inplace=True)", "df.columns['old_name'] = 'new_name'", "df.change_name('old_name', 'new_name')", "df.rename(columns={'old_name': 'new_name'}, inplace=True)"],
                answer: 3,
                rationale: "הפקודה rename דורשת לקבל מילון (Dictionary) הממפה בין השם הישן לשם החדש בתוך הפרמטר columns."
            },

            // Filtering and loc/iloc
            {
                q: "מהי הדרך הנכונה לסנן את ה-DataFrame כך שיישארו רק שורות בהן הגיל (Age) גדול מ-30?",
                options: ["df.filter('Age' > 30)", "df.where(Age > 30)", "df[df['Age'] > 30]", "df.select(df['Age'] > 30)"],
                answer: 2,
                rationale: "זהו סינון בוליאני קלאסי. אנו מעבירים את התנאי הלוגי לתוך סוגריים מרובעים של הטבלה עצמה."
            },
            {
                q: "מה ההבדל העקרוני בין השימוש ב-loc לבין iloc?",
                options: ["אין שום הבדל, שתי הפקודות עושות בדיוק אותו הדבר.", "loc עובד לפי מיקומים מספריים בלבד, ו-iloc עובד לפי שמות עמודות ותנאים לוגיים.", "loc עובד לפי שמות (תוויות) ותנאים לוגיים, ו-iloc עובד לפי מיקומים מספריים מוחלטים (אינדקסים).", "loc מיועד לשליפת שורות, ו-iloc מיועד לשליפת עמודות."],
                answer: 2,
                rationale: "iloc (Index Location) פועל כמו מערך פייתון רגיל עם מספרים 0,1,2. לעומתו loc מאפשר שליפה לפי שמות מחרוזות ותנאים של גדול/קטן."
            },
            {
                q: "כיצד נשלוף את הערך המדויק שנמצא בשורה השלישית ובעמודה הראשונה בטבלה, תוך התעלמות משמות העמודות?",
                options: ["df.loc[2, 0]", "df.iloc[3, 1]", "df.iloc[2, 0]", "df.get_value(3, 1)"],
                answer: 2,
                rationale: "מכיוון שביקשנו להתעלם משמות, נשתמש ב-iloc. הספירה בפייתון מתחילה מ-0, לכן שורה שלישית היא אינדקס 2, ועמודה ראשונה היא אינדקס 0."
            },
            {
                q: "אנו רוצים לעדכן את השכר (Salary) לערך 0 עבור כל מי שגילו (Age) קטן מ-18. איזו פקודה תבצע זאת ישירות ובטוח?",
                options: ["df[df['Age'] < 18]['Salary'] = 0", "df.loc[df['Age'] < 18, 'Salary'] = 0", "df.update('Salary' = 0, where='Age'<18)", "df.iloc[df['Age'] < 18, 'Salary'] = 0"],
                answer: 1,
                rationale: "פקודת loc במבנה של [תנאי, שם_עמודה] היא הדרך התקנית והבטוחה לבצע עדכון מותנה ללא אזהרות פייתון."
            },

            // Missing Values & Cleaning
            {
                q: "איזה מהפקודות הבאות תחזיר טבלה בוליאנית של True ו-False, המציינת באילו תאים חסר מידע בטבלה?",
                options: ["df.missing_values()", "df.findna()", "df.isnull()", "df.empty()"],
                answer: 2,
                rationale: "הפונקציות isnull() או isna() מחזירות True עבור כל תא שמכיל את הערך החסר NaN."
            },
            {
                q: "מה יקרה אם נפעיל את הפקודה df.dropna(subset=['Price']) על הטבלה שלנו?",
                options: ["כל השורות בטבלה שבהן עמודת ה-'Price' מכילה ערך חסר (NaN) יימחקו.", "עמודת ה-'Price' תימחק לחלוטין מהטבלה.", "הפקודה תשנה את כל הערכים החסרים ב-'Price' לממוצע.", "הפקודה תמחק את כל הטבלה אם יש ערך חסר כלשהו."],
                answer: 0,
                rationale: "הפרמטר subset מגביל את החיפוש של dropna כך שהוא יבדוק רק את העמודות שציינו ברשימה."
            },
            {
                q: "אנו מעוניינים להחליף את כל הערכים החסרים בטבלה במספר 0. מהי הדרך הנכונה לעשות זאת כך שהטבלה המקורית תשתנה?",
                options: ["df = df.replace(NaN, 0)", "df.fill_null(0, inplace=True)", "df.fillna(0, inplace=True)", "df.dropna(0, replace=True)"],
                answer: 2,
                rationale: "הפונקציה fillna נועדה למילוי ערכי NaN. הפרמטר inplace=True חוסך את הצורך בהשמה (df = df...)."
            },
            {
                q: "אנו מנסים להמיר עמודת 'שכר' מטיפוס Object ל-float64 בעזרת pd.to_numeric. העמודה מכילה בטעות את המילה 'Unknown' בשורה אחת. מה כדאי להוסיף לפקודה כדי שהתוכנית לא תקרוס?",
                options: ["errors='ignore'", "errors='coerce'", "errors='raise'", "skip_text=True"],
                answer: 1,
                rationale: "הפרמטר errors='coerce' אומר לפונקציה: 'אם אתה נתקל בטקסט שאי אפשר להמיר למספר, אל תקרוס, אלא פשוט תציב במקומו את הערך החסר NaN'."
            },
            {
                q: "מה מבצעת הפקודה df['Age'].astype('float64')?",
                options: ["מחזירה שגיאה מכיוון שלא ניתן להמיר עמודה שלמה בפעם אחת.", "מחשבת את המספר העשרוני הממוצע של העמודה.", "ממירה (Casting) את כל הערכים בעמודת 'Age' לטיפוס מספר עשרוני.", "ממירה מספרים עשרוניים למחרוזות טקסט."],
                answer: 2,
                rationale: "astype היא הפונקציה המובנית של פנדס לביצוע Casting (המרת טיפוסי נתונים)."
            },

            // Basic Stats & Groupby & Agg
            {
                q: "מה מייצג הציר axis=0 בפעולות סטטיסטיות ב-Pandas (כמו חישוב ממוצע)?",
                options: ["תנועה הצידה משמאל לימין לאורך העמודות.", "התעלמות משורות המכילות ערך 0.", "חישוב הפעולה רק על העמודה הראשונה.", "תנועה אנכית מלמעלה למטה לאורך השורות (חישוב נתון לכל עמודה בנפרד)."],
                answer: 3,
                rationale: "ציר 0 (ברירת המחדל) "רוכב" על האינדקסים מלמעלה למטה, ולכן כשאנחנו עושים sum(axis=0) אנחנו סוכמים כל עמודה."
            },
            {
                q: "אנו מעוניינים לדעת כמה לקוחות שונים מגיעים מכל עיר. באיזו פונקציה נשתמש על עמודת ה-'City'?",
                options: ["df['City'].sum()", "df['City'].value_counts()", "df['City'].describe()", "df['City'].count_unique()"],
                answer: 1,
                rationale: "הפונקציה value_counts סופרת את התדירות (כמות ההופעות) של כל ערך ייחודי בעמודה נתונה."
            },
            {
                q: "מה יקרה אם נפעיל את הפקודה df.groupby('City').mean()['Salary']?",
                options: ["תתקבל שגיאת סינטקס.", "נמצא מהי העיר הממוצעת.", "הנתונים יקובצו לפי עיר, המערכת תחשב ממוצע לכל עמודה אפשרית, ולבסוף תוצג רק התוצאה של עמודת ה-'Salary'.", "כל הערים יקבלו את ממוצע השכר הכללי של החברה."],
                answer: 2,
                rationale: "זהו שרשור תקין: הקיבוץ מתבצע קודם, לאחר מכן פונקציית הממוצע מופעלת על כל הקבוצות, ולבסוף אנו מפלטרים רק את העמודה שמעניינת אותנו."
            },
            {
                q: "כיצד נוכל, עבור כל קטגוריה בנפרד, לחשב גם את סכום ה-'Salary' וגם את המקסימום של ה-'Age' באותה פקודה?",

            },

                q: "מדד הדיוק הכללי (Accuracy) אינו מומלץ לשימוש במקרים של 'חוסר איזון בנתונים' (למשל, 99% מיילים רגילים ורק 1% ספאם). מדוע?",
                options: ["מפני שאלגוריתם פשוט שמנחש תמיד 'מייל רגיל' יקבל ציון Accuracy של 99%, למרות שהוא לא מזהה ספאם בכלל ומעוות את תמונת ההצלחה.", "מפני ש-Accuracy לא מסוגל להתמודד עם מספרים מעל 100.", "מפני שהוא מחשב רק את הטעויות מסוג False Negative.", "אין סיבה, Accuracy הוא תמיד המדד הטוב ביותר."],
                answer: 0,
                rationale: "בנתונים לא מאוזנים אנו צריכים מדד שיוכיח שהמודל באמת למד לזהות את תופעת המיעוט (כמו F1 Score), ולא סתם מהמר על תופעת הרוב."
            },
            {
                q: "מה מייצג מדד ה-Recall (רגישות)?",
                options: ["מתוך כל הפעמים שהמודל הכריז 'חיובי', כמה מהם באמת היו חיוביים (בדיקת אזעקות שווא).", "מתוך כל המקרים האמיתיים של התופעה (למשל, כל החולים במציאות), כמה המודל הצליח 'לתפוס' ולזהות נכון.", "את ממוצע המהירות של אימון המודל.", "את היחס בין השגיאה החיובית לשלילית."],
                answer: 1,
                rationale: "ה-Recall מודד כמה מהתופעה האמיתית 'החזרנו' אלינו (Recall). רגישות גבוהה שואפת לאפס פספוסים (False Negatives)."
            },
            {
                q: "בגרף הערכת ביצועים מסוג ROC, מה משמעות השטח תחת העקומה (ROC AUC) כאשר ערכו עומד על 0.5?",
                options: ["המודל מסוגל להפריד בין המחלקות ב-100% מהמקרים (מושלם).", "המודל חוזה רק תוצאות חיוביות.", "למודל אין שום כוח ניבוי, והביצועים שלו שקולים לניחוש אקראי לחלוטין (כמו הטלת מטבע).", "המודל סובל מבעיה של התאמת יתר."],
                answer: 2,
                rationale: "שטח של 0.5 בגרף ROC מצויר כקו אלכסוני ישיר. הוא מעיד שעל כל זיהוי נכון, המודל גם מייצר אזעקת שווא, ואין לו באמת יכולת אבחנה."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const feedbackContainer = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackRationale = document.getElementById('feedback-rationale');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            const q = questions[currentQuestionIndex];
            
            questionText.style.animation = 'none';
            questionText.offsetHeight; 
            questionText.style.animation = 'fadeIn 0.3s ease-out forwards';
            
            questionText.textContent = `${currentQuestionIndex + 1}. ${q.q}`;
            questionCounter.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
            
            optionsContainer.innerHTML = '';
            feedbackContainer.classList.add('hidden');
            feedbackContainer.classList.remove('bg-emerald-500/20', 'border-emerald-500/30', 'bg-red-500/20', 'border-red-500/30');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 sm:p-5 rounded-2xl text-lg text-slate-200 focus:outline-none flex justify-between items-center group font-medium text-right mb-3';
                btn.innerHTML = `
                    <span class="ml-4 flex-grow leading-snug" style="direction: rtl;">${opt}</span>
                    <div class="w-6 h-6 rounded-full border border-white/20 flex-shrink-0 flex items-center justify-center transition-all option-circle bg-white/5 group-hover:bg-white/10"></div>
                `;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.answer;
            const allBtns = optionsContainer.children;

            for(let i=0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                const circle = allBtns[i].querySelector('.option-circle');
                
                if(i === q.answer) {
                    allBtns[i].classList.add('correct');
                    circle.innerHTML = '<i class="fa-solid fa-check text-sm"></i>';
                    circle.className = "w-6 h-6 rounded-full bg-emerald-500 text-white flex-shrink-0 flex items-center justify-center shadow-[0_0_10px_rgba(16,185,129,0.5)]";
                } else if(i === selectedIndex && !isCorrect) {
                    allBtns[i].classList.add('incorrect');
                    circle.innerHTML = '<i class="fa-solid fa-xmark text-sm"></i>';
                    circle.className = "w-6 h-6 rounded-full bg-red-500 text-white flex-shrink-0 flex items-center justify-center";
                } else {
                    allBtns[i].classList.add('opacity-40');
                }
            }

            feedbackContainer.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            
            if(isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                feedbackContainer.classList.add('bg-emerald-500/20', 'border-emerald-500/30');
                feedbackTitle.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 ml-2"></i> תשובה נכונה!';
                feedbackTitle.className = "text-xl font-bold text-emerald-400 mb-2";
            } else {
                feedbackContainer.classList.add('bg-red-500/20', 'border-red-500/30');
                feedbackTitle.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-400 ml-2"></i> טעות!';
                feedbackTitle.className = "text-xl font-bold text-red-400 mb-2";
            }

            feedbackRationale.innerHTML = `<span class="font-bold text-white">הסבר: </span>${q.rationale}`;
            
            if(currentQuestionIndex === questions.length - 1) {
                nextBtn.innerHTML = 'סיים מבחן וצפה בתוצאות <i class="fa-solid fa-flag-checkered mr-2"></i>';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            progressBar.style.width = '100%';
            
            const percentage = Math.round((score / questions.length) * 100);
            
            let currentNum = 0;
            const targetNum = percentage;
            const numElement = document.getElementById('final-percentage');
            const interval = setInterval(() => {
                if (currentNum >= targetNum) {
                    clearInterval(interval);
                    numElement.textContent = targetNum;
                } else {
                    currentNum++;
                    numElement.textContent = currentNum;
                }
            }, 20);

            const subtitle = document.getElementById('result-subtitle');
            if(percentage >= 90) subtitle.innerHTML = `ציון של ${score} מתוך ${questions.length}.<br>מושלם! אתה שולט בחומר ברמה של 100.`;
            else if(percentage >= 75) subtitle.innerHTML = `השגת ${score} מתוך ${questions.length}.<br>כל הכבוד, אתה מוכן למבחן!`;
            else if(percentage >= 60) subtitle.innerHTML = `ציון ${score}/${questions.length}.<br>כמעט שם. מומלץ לעבור על השאלות שטעית בהן.`;
            else subtitle.innerHTML = `הוצאת ${score}/${questions.length}.<br>שווה לחזור על הסיכום שלמדנו. לא לוותר!`;
        }
    </script>
</body>
</html>
