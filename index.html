<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאסטר SPSS: הכנה למבחן בסטטיסטיקה יישומית</title>
    <!-- טעינת גופן מודרני מגוגל -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #0ea5e9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            margin-bottom: 40px;
        }

        .app-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .app-header p {
            margin: 0;
            font-size: 1.3rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 0 20px 60px;
        }

        .progress-bar-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .progress-track {
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary) 0%, var(--primary) 100%);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            animation: slideUp 0.5s ease-out;
            margin-bottom: 30px;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .spss-container {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 20px;
            margin: 25px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            /* SPSS Output is usually LTR */
            direction: ltr; 
            text-align: left;
            overflow-x: auto;
            border-radius: 8px;
        }

        .spss-title {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            color: #000;
        }

        .spss-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #000;
            min-width: 600px;
        }

        .spss-table th, .spss-table td {
            padding: 6px 10px;
            text-align: right;
        }

        .spss-table th {
            border-top: 2px solid #000;
            border-bottom: 1px solid #000;
            font-weight: bold;
            vertical-align: bottom;
        }

        .spss-table .row-header {
            text-align: left;
            font-weight: normal;
        }

        .spss-table tbody tr:last-child td {
            border-bottom: 2px solid #000;
        }

        .spss-footer {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333;
            margin-top: 10px;
        }

        .options-grid {
            display: grid;
            gap: 16px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: right;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .option-btn:hover:not(:disabled) {
            border-color: #94a3b8;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .option-btn.correct {
            background: var(--success-light);
            border-color: var(--success);
            color: #064e3b;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .option-btn.wrong {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #7f1d1d;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
            opacity: 0.7;
        }

        .option-btn:disabled {
            cursor: default;
            transform: none;
        }

        .feedback-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            animation: slideUp 0.4s ease-out;
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .feedback-box h4 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-box.correct-feedback {
            display: block;
            background: #ecfdf5;
            border-right: 6px solid var(--success);
            color: #064e3b;
        }

        .feedback-box.wrong-feedback {
            display: block;
            background: #fef2f2;
            border-right: 6px solid var(--danger);
            color: #7f1d1d;
        }

        .correct-answer-highlight {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--danger);
            margin: 10px 0;
            font-weight: 700;
        }

        /* Navigation */
        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 30px;
        }

        .btn-next {
            display: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(79, 70, 229, 0.35);
        }

        #resultsScreen {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            border: 10px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 0 auto 30px;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.2);
            position: relative;
        }

        @media (max-width: 768px) {
            .card { padding: 25px; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 1.1rem; padding: 15px; }
            .app-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>מאסטר SPSS</h1>
        <p>תרגול סימולציות וקריאת פלטים - סטטיסטיקה יישומית</p>
    </header>

    <div class="container">
        
        <!-- Quiz Section -->
        <div id="quizScreen">
            <div class="progress-bar-container">
                <div class="progress-info">
                    <span id="progressText">שאלה 1 מתוך X</span>
                    <span id="scoreTracker">הצלחות: 0</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="card" id="questionCard">
                <div class="question-text" id="questionText">טוען שאלה...</div>
                <div id="tableContainer"></div>
                
                <div class="options-grid" id="optionsGrid">
                    <!-- Options injected via JS -->
                </div>

                <div id="feedbackBox" class="feedback-box">
                    <!-- Feedback injected via JS -->
                </div>

                <div class="action-container">
                    <button class="btn-next" id="btnNext" onclick="nextQuestion()">לשאלה הבאה ❯</button>
                </div>
            </div>
        </div>

        <div id="resultsScreen" class="card">
            <h2>סיום המבחן!</h2>
            <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">הנה התוצאה הסופית שלך:</p>
            <div class="score-circle" id="finalScore">0%</div>
            <h3 id="finalMessage" style="font-size: 1.8rem; margin-bottom: 40px; color: var(--text-dark);"></h3>
            <button class="btn-next" style="display: inline-block;" onclick="location.reload()">↻ התחל תרגול מחדש</button>
        </div>

    </div>

    <script>
        const questions = [
            // --- TOPIC: RULES & BASICS ---
            {
                q: "מהו הכלל המרכזי והחשוב ביותר לדחיית השערת האפס (H0) בכל פלט סטטיסטי של SPSS?",
                table: "",
                options: [
                    "כאשר ערך ה- Sig גדול מ- 0.05",
                    "כאשר ערך ה- Sig קטן מ- 0.05",
                    "כאשר מבחן T חיובי",
                    "כאשר ערך ה- Beta קרוב ל- 1"
                ],
                ans: 1,
                exp: "<strong>חוק הברזל:</strong> תמיד דוחים את H0 (ומסיקים שהמודל/הקשר/ההבדל מובהק) כאשר ה-Sig (רמת המובהקות) <strong>קטן מ-0.05</strong>."
            },
            
            // --- TOPIC: CHI-SQUARE (FULL TABLES) ---
            {
                q: "חוקר בדק את הקשר בין 'מגדר' (גברים/נשים) לבין 'הרגלי עישון' (מעשן/לא מעשן). לפניך פלט ה-SPSS. מה המסקנה הסטטיסטית?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Chi-Square Tests</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th>Value</th><th>df</th><th>Asymp. Sig. (2-sided)</th><th>Exact Sig. (2-sided)</th><th>Exact Sig. (1-sided)</th></tr>
                    </thead>
                    <tbody>
                      <tr><td class="row-header">Pearson Chi-Square</td><td>8.353<sup>a</sup></td><td>1</td><td>.004</td><td></td><td></td></tr>
                      <tr><td class="row-header">Continuity Correction<sup>b</sup></td><td>7.687</td><td>1</td><td>.006</td><td></td><td></td></tr>
                      <tr><td class="row-header">Likelihood Ratio</td><td>8.674</td><td>1</td><td>.003</td><td></td><td></td></tr>
                      <tr><td class="row-header">Fisher's Exact Test</td><td></td><td></td><td></td><td>.005</td><td>.002</td></tr>
                      <tr><td class="row-header">N of Valid Cases</td><td>1059</td><td></td><td></td><td></td><td></td></tr>
                    </tbody>
                  </table>
                  <div class="spss-footer">a. 0 cells (0.0%) have expected count less than 5. The minimum expected count is 35.29.<br>b. Computed only for a 2x2 table</div>
                </div>
                `,
                options: [
                    "לא דוחים את H0, מכיוון שה-Sig קטן מ-0.05. אין קשר בין המשתנים.",
                    "דוחים את H0, מכיוון שה-Sig של פירסון קטן מ-0.05. קיים קשר מובהק בין המשתנים.",
                    "המבחן לא תקין ויש להסתכל על שורת Fisher's Exact Test.",
                    "המודל מסביר 8.35% מהשונות."
                ],
                ans: 1,
                exp: "מסתכלים על השורה <strong>Pearson Chi-Square</strong> ועמודת <strong>Asymp. Sig</strong>. הערך הוא .004, שזה קטן מ-0.05. לכן <strong>דוחים את השערת האפס</strong> ומסיקים שיש קשר מובהק. המבחן תקין כי ההערה אומרת ש-0 תאים קטנים מ-5."
            },
            {
                q: "בפלט חי בריבוע אחר, הופיעו הנתונים הבאים. האם המבחן שבוצע תקין, ועל איזו שורה יש להסתכל?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Chi-Square Tests</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th>Value</th><th>df</th><th>Asymp. Sig. (2-sided)</th><th>Exact Sig. (2-sided)</th></tr>
                    </thead>
                    <tbody>
                      <tr><td class="row-header">Pearson Chi-Square</td><td>4.636<sup>a</sup></td><td>1</td><td>.031</td><td></td></tr>
                      <tr><td class="row-header">Fisher's Exact Test</td><td></td><td></td><td></td><td>.037</td></tr>
                      <tr><td class="row-header">N of Valid Cases</td><td>580</td><td></td><td></td><td></td></tr>
                    </tbody>
                  </table>
                  <div class="spss-footer">a. 2 cells (50.0%) have expected count less than 5. The minimum expected count is 2.10.</div>
                </div>
                `,
                options: [
                    "המבחן תקין. נסתכל על פירסון ונקבע ש-Sig = 0.031.",
                    "המבחן לא תקין כי יש 50% תאים עם שכיחות צפויה קטנה מ-5. נסתכל על מבחן פישר ונקבע ש-Sig = 0.037.",
                    "המבחן תקין כי יש פחות מ-5 תאים פגומים.",
                    "דוחים את השערת האפס כי 580 זה מדגם גדול."
                ],
                ans: 1,
                exp: "התנאי למבחן חי בריבוע תקין הוא ש**מקסימום 20% מהתאים** יהיו קטנים מ-5. כאן כתוב 50.0%, לכן התנאי הופר ויש להסתכל על השורה של <strong>Fisher's Exact Test</strong>."
            },

            // --- STREAMING_CHUNK: TOPIC: REGRESSION (FULL TABLES) ---
            {
                q: "חוקר הריץ רגרסיה מרובה לניבוי 'שכר נוכחי' בעזרת 'רמת השכלה' ו'שכר התחלתי'. התבונן בשתי הטבלאות הראשונות מהפלט. מה אחוז השונות שהמודל מסביר, והאם המודל כולו מובהק?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Model Summary</div>
                  <table class="spss-table" style="margin-bottom: 20px;">
                    <thead><tr><th>Model</th><th>R</th><th>R Square</th><th>Adjusted R Square</th><th>Std. Error of the Estimate</th></tr></thead>
                    <tbody><tr><td>1</td><td>.873<sup>a</sup></td><td>.762</td><td>.761</td><td>7030.278</td></tr></tbody>
                  </table>
                  
                  <div class="spss-title">ANOVA<sup>b</sup></div>
                  <table class="spss-table">
                    <thead><tr><th>Model</th><th></th><th>Sum of Squares</th><th>df</th><th>Mean Square</th><th>F</th><th>Sig.</th></tr></thead>
                    <tbody>
                      <tr><td>1</td><td class="row-header">Regression</td><td>7.2E+10</td><td>2</td><td>3.58E+10</td><td>724.397</td><td>.000<sup>a</sup></td></tr>
                      <tr><td></td><td class="row-header">Residual</td><td>2.2E+10</td><td>452</td><td>4.9E+07</td><td></td><td></td></tr>
                      <tr><td></td><td class="row-header">Total</td><td>9.4E+10</td><td>454</td><td></td><td></td><td></td></tr>
                    </tbody>
                  </table>
                </div>
                `,
                options: [
                    "המודל מסביר 87.3% מהשונות. הוא אינו מובהק כי F גבוה מדי.",
                    "המודל מסביר 76.2% מהשונות. המודל כולו מובהק סטטיסטית כי ה-Sig ב-ANOVA קטן מ-0.05.",
                    "המודל מסביר 76.2% מהשונות. המודל אינו מובהק סטטיסטית.",
                    "המודל מסביר 0.00% מהשונות בגלל ה-Sig."
                ],
                ans: 1,
                exp: "אחוז השונות המוסברת נמצא ב-<strong>R Square</strong> (כאן .762, כלומר 76.2%). מובהקות המודל כולו נבדקת בטבלת ה-<strong>ANOVA</strong>, שם ה-Sig הוא .000 (קטן מ-0.05), ולכן המודל מובהק."
            },
            {
                q: "בהמשך לאותה רגרסיה, התבונן בטבלת המקדמים (Coefficients). מי מבין המשתנים משפיע **יותר** על השכר הנוכחי, ומהי משוואת הניבוי?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Coefficients<sup>a</sup></div>
                  <table class="spss-table">
                    <thead>
                      <tr><th>Model</th><th></th><th colspan="2" style="text-align:center;">Unstandardized Coefficients</th><th>Standardized Coefficients</th><th>t</th><th>Sig.</th></tr>
                      <tr><th></th><th></th><th>B</th><th>Std. Error</th><th>Beta</th><th></th><th></th></tr>
                    </thead>
                    <tbody>
                      <tr><td>1</td><td class="row-header">(Constant)</td><td>-6335.179</td><td>1648.491</td><td></td><td>-3.843</td><td>.000</td></tr>
                      <tr><td></td><td class="row-header">Education Level</td><td>997.984</td><td>156.583</td><td>.195</td><td>6.374</td><td>.000</td></tr>
                      <tr><td></td><td class="row-header">Beginning Salary</td><td>1.570</td><td>.065</td><td>.732</td><td>23.976</td><td>.000</td></tr>
                    </tbody>
                  </table>
                </div>
                `,
                options: [
                    "השכלה משפיעה יותר (B=997). המשוואה: Y = 997X1 + 1.57X2 - 6335",
                    "שכר התחלתי משפיע יותר (Beta=0.732). המשוואה: Y = 0.195X1 + 0.732X2",
                    "שכר התחלתי משפיע יותר (Beta=0.732). המשוואה: Y = 997.98X1 + 1.57X2 - 6335.17",
                    "שניהם משפיעים באותה מידה כי ה-Sig של שניהם הוא .000."
                ],
                ans: 2,
                exp: "כדי לדעת **מי משפיע יותר**, מסתכלים על עמודת **Beta** (מקדמים מתוקננים). 0.732 גדול מ-0.195 ולכן שכר התחלתי משפיע יותר. <br>כדי **להרכיב משוואה**, משתמשים אך ורק בעמודת **B** (מקדמים לא מתוקננים): Y = 997.98X1 + 1.57X2 - 6335."
            },

            // --- STREAMING_CHUNK: TOPIC: T-TESTS (FULL TABLES) ---
            {
                q: "חוקר רצה לבדוק האם יש הבדל ב'משך אשפוז' בין נפגעי טרור לנפגעי תאונות דרכים. הוא ביצע מבחן T למדגמים בלתי תלויים. לפי הפלט, האם קיים הבדל מובהק בין הקבוצות?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Independent Samples Test</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th></th><th colspan="2" style="text-align:center; border-bottom:1px solid #000;">Levene's Test</th><th colspan="4" style="text-align:center; border-bottom:1px solid #000;">t-test for Equality of Means</th></tr>
                      <tr><th></th><th></th><th>F</th><th>Sig.</th><th>t</th><th>df</th><th>Sig. (2-tailed)</th><th>Mean Difference</th></tr>
                    </thead>
                    <tbody>

        // --- STREAMING_CHUNK: Application Logic ---
        let currentQuestionIndex = 0;
        let score = 0;
        const userAnswers = new Array(questions.length).fill(null);

        function initQuiz() {
            renderQuestion(currentQuestionIndex);
            updateProgress();
        }

        function renderQuestion(index) {
            const q = questions[index];
            const container = document.getElementById('optionsGrid');
            
            document.getElementById('questionText').innerHTML = `שאלה ${index + 1}: ${q.q}`;
            document.getElementById('tableContainer').innerHTML = q.table ? q.table : '';
            
            let html = '';
            q.options.forEach((opt, optIndex) => {
                // Determine state if already answered
                let btnClass = 'option-btn';
                let disabledAttr = '';
                
                if (userAnswers[index] !== null) {
                    disabledAttr = 'disabled';
                    if (optIndex === q.ans) {
                        btnClass += ' correct';
                    } else if (optIndex === userAnswers[index]) {
                        btnClass += ' wrong';
                    }
                }

                html += `
                    <button class="${btnClass}" ${disabledAttr} onclick="checkAnswer(${optIndex}, this)">
                        <div style="flex-grow:1; text-align:right;">${opt}</div>
                    </button>
                `;
            });
            
            container.innerHTML = html;

            const feedbackBox = document.getElementById('feedbackBox');
            if (userAnswers[index] !== null) {
                showFeedback(index, userAnswers[index]);
                document.getElementById('btnNext').style.display = 'inline-block';
            } else {
                feedbackBox.style.display = 'none';
                document.getElementById('btnNext').style.display = 'none';
            }

            if (index === questions.length - 1 && userAnswers[index] !== null) {
                document.getElementById('btnNext').innerText = 'סיום והצגת ציון 🏆';
            } else {
                document.getElementById('btnNext').innerText = 'לשאלה הבאה ❯';
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (userAnswers[currentQuestionIndex] !== null) return; // Prevent double click

            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.ans;
            
            if (isCorrect) score++;

            renderQuestion(currentQuestionIndex); // Re-render to show colors
            updateProgress();
        }

        function showFeedback(index, selectedIndex) {
            const q = questions[index];
            const isCorrect = selectedIndex === q.ans;
            const feedbackBox = document.getElementById('feedbackBox');
            
            if (isCorrect) {
                feedbackBox.className = 'feedback-box correct-feedback';
                feedbackBox.innerHTML = `
                    <h4><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> כל הכבוד! תשובה נכונה.</h4>
                    <p>${q.exp}</p>
                `;
            } else {
                feedbackBox.className = 'feedback-box wrong-feedback';
                feedbackBox.innerHTML = `
                    <h4><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> טעות!</h4>
                    <p>התשובה הנכונה היא:</p>
                    <div class="correct-answer-highlight">${q.options[q.ans]}</div>
                    <p><strong>למה?</strong> ${q.exp}</p>
                `;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
                updateProgress();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            document.getElementById('progressText').innerText = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
            document.getElementById('scoreTracker').innerText = `הצלחות: ${score}/${questions.length}`;
            
            const percent = ((answeredCount) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            const resultsScreen = document.getElementById('resultsScreen');
            resultsScreen.style.display = 'block';

            const percent = Math.round((score / questions.length) * 100);
            
            // Animation for circle
            let currentPercent = 0;
            const scoreElement = document.getElementById('finalScore');
            const timer = setInterval(() => {
                currentPercent += 2;
                if (currentPercent >= percent) {
                    currentPercent = percent;
                    clearInterval(timer);
                }
                scoreElement.innerText = `${currentPercent}%`;
            }, 30);

            let msg = "";
            if (percent === 100) msg = "מאסטר SPSS אמיתי! 🏆<br>אתה מוכן לחלוטין למבחן.";
            else if (percent >= 80) msg = "עבודה מעולה! 🌟<br>שליטה טובה מאוד בחומר ובקריאת הפלטים.";
            else if (percent >= 60) msg = "ציון עובר 👍<br>מומלץ לחזור שוב על השאלות שטעית בהן (במיוחד קריאת טבלאות).";
            else msg = "לא נורא 💪<br>זכור את חוק ה-Sig, קרא שוב את הכללים, ותעשה את המבחן מחדש.";

            document.getElementById('finalMessage').innerHTML = msg;
        }

        // Start App
        initQuiz();
    </script>
