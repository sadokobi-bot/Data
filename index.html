<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן מסכם: מבוא למדע הנתונים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.1;
            animation: floatCircle 20s infinite ease-in-out;
        }

        .bg-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .bg-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .bg-circle:nth-child(3) {
            width: 250px;
            height: 250px;
            bottom: 10%;
            left: 20%;
            animation-delay: 10s;
        }

        @keyframes floatCircle {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .container {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Start Screen */
        .start-screen {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 70px 50px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-wrapper {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            animation: rotateIcon 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        @keyframes rotateIcon {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(5deg) scale(1.05);
            }
        }

        .icon-wrapper svg {
            width: 70px;
            height: 70px;
            fill: white;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-weight: 800;
            line-height: 1.2;
        }

        .description {
            font-size: 1.3em;
            color: #5a6c7d;
            margin-bottom: 50px;
            line-height: 1.7;
            font-weight: 500;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 1.4em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .start-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        .start-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .start-btn span,
        .start-btn svg {
            position: relative;
            z-index: 1;
        }

        /* Quiz Screen */
        .quiz-screen {
            display: none;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #5a6c7d;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e8ecf1;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .question-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .question-text {
            font-size: 1.6em;
            color: #2d3748;
            margin-bottom: 40px;
            line-height: 1.7;
            font-weight: 700;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 35px;
        }

        .option {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.15em;
            color: #4a5568;
            position: relative;
            overflow: hidden;
            font-weight: 500;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.15), transparent);
            transition: right 0.6s;
        }

        .option:hover:not(.disabled)::before {
            right: 100%;
        }

        .option:hover:not(.disabled) {
            border-color: #667eea;
            background: #edf2f7;
            transform: translateX(-8px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .option.correct {
            border-color: #48bb78;
            background: linear-gradient(135deg, #48bb7820 0%, #38a16920 100%);
            color: #2f855a;
            font-weight: 700;
            animation: correctPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.3);
        }

        @keyframes correctPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        .option.incorrect {
            border-color: #f56565;
            background: linear-gradient(135deg, #f5656520 0%, #e53e3e20 100%);
            color: #c53030;
            font-weight: 700;
            animation: shake 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(245, 101, 101, 0.3);
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-12px);
            }
            75% {
                transform: translateX(12px);
            }
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-icon {
            width: 35px;
            height: 35px;
            display: none;
            font-size: 28px;
            font-weight: bold;
        }

        .option.correct .option-icon,
        .option.incorrect .option-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-section {
            border-top: 2px solid #e2e8f0;
            padding-top: 30px;
        }

        .check-btn,
        .next-btn {
            width: 100%;
            padding: 25px;
            border: none;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .check-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .check-btn:hover:not(:disabled)::before {
            width: 400px;
            height: 400px;
        }

        .check-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        .check-btn:disabled {
            background: #e2e8f0;
            color: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            box-shadow: 0 15px 40px rgba(45, 55, 72, 0.3);
        }

        .next-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .next-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(45, 55, 72, 0.5);
        }

        .rationale {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border-right: 6px solid #667eea;
            animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .rationale-title {
            font-weight: 800;
            color: #667eea;
            margin-bottom: 12px;
            font-size: 1.2em;
        }

        .rationale-text {
            color: #4a5568;
            line-height: 1.8;
            font-size: 1.1em;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 70px 50px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .trophy-icon {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #f6e05e 0%, #ed8936 100%);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            animation: bounce 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 70px rgba(246, 224, 94, 0.4);
            position: relative;
            overflow: hidden;
        }

        .trophy-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 3s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-40px) scale(1.1);
            }
        }

        .trophy-icon svg {
            width: 100px;
            height: 100px;
            fill: white;
            position: relative;
            z-index: 1;
        }

        .results-title {
            font-size: 3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .score-display {
            font-size: 5em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 40px 0;
            animation: scaleIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .score-message {
            font-size: 1.4em;
            color: #4a5568;
            margin-bottom: 50px;
            line-height: 1.7;
            font-weight: 600;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 1.4em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .restart-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .restart-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .restart-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        .restart-btn span,
        .restart-btn svg {
            position: relative;
            z-index: 1;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background: #f6e05e;
            position: absolute;
            animation: confettiFall 3s linear;
            z-index: 1000;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Streak Counter */
        .streak-counter {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            display: none;
            align-items: center;
            gap: 15px;
            font-weight: 800;
            font-size: 1.4em;
            z-index: 1000;
            animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .streak-counter.active {
            display: flex;
        }

        .streak-fire {
            font-size: 2em;
            animation: fireFlicker 0.6s infinite;
        }

        @keyframes fireFlicker {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .question-text {
                font-size: 1.3em;
            }
            
            .option {
                font-size: 1em;
                padding: 20px 25px;
            }
            
            .score-display {
                font-size: 3.5em;
            }
            
            .streak-counter {
                top: 15px;
                left: 15px;
                padding: 15px 25px;
                font-size: 1.1em;
            }
            
            .start-screen,
            .results-screen {
                padding: 50px 30px;
            }
            
            .question-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    
    <div class="streak-counter" id="streakCounter">
        <span class="streak-fire">🔥</span>
        <span id="streakCount">0</span>
    </div>

    <div class="container">
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 6.253V13M12 13V19.747M12 13H18.75C19.3023 13 19.75 12.5523 19.75 12V6.25C19.75 5.69772 19.3023 5.25 18.75 5.25H5.25C4.69772 5.25 4.25 5.69772 4.25 6.25V12C4.25 12.5523 4.69772 13 5.25 13H12Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>מבחן מסכם: מבוא למדע הנתונים</h1>
            <p class="description">
                80 שאלות שבודקות את כל מה שחשוב לדעת לקראת הבחינה. כולל Pandas, מודלים של Machine Learning, ויזואליזציה ומדדי הערכה.
            </p>
            <button class="start-btn" onclick="startQuiz()">
                <span>התחל במבחן</span>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5V19L19 12L8 5Z" fill="white"/>
                </svg>
            </button>
        </div>

        <!-- Quiz Screen -->
        <div class="quiz-screen" id="quizScreen">
            <div class="progress-container">
                <div class="progress-info">
                    <span id="questionCounter">שאלה 1 מתוך 80</span>
                    <span id="scoreDisplay">ציון ביניים: 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="question-card">
                <h2 class="question-text" id="questionText"></h2>
                
                <div class="options-container" id="optionsContainer"></div>

                <div class="action-section">
                    <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled>
                        <span>בדוק תשובה</span>
                    </button>
                    
                    <div id="rationaleSection" style="display: none;">
                        <div class="rationale">
                            <div class="rationale-title">💡 הסבר:</div>
                            <div class="rationale-text" id="rationaleText"></div>
                        </div>
                        <button class="next-btn" onclick="nextQuestion()">
                            <span id="nextBtnText">לשאלה הבאה</span>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="resultsScreen">

        let currentQuestionIndex = 0;
        let selectedOption = null;
        let isAnswerChecked = false;
        let score = 0;
        let streak = 0;

        function startQuiz() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            document.getElementById('questionText').textContent = question.text;
            document.getElementById('questionCounter').textContent = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
            document.getElementById('scoreDisplay').textContent = `ציון ביניים: ${score}`;
            document.getElementById('progressFill').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectOption(index);
                
                const icon = document.createElement('div');
                icon.className = 'option-icon';
                optionDiv.appendChild(icon);
                
                optionsContainer.appendChild(optionDiv);
            });
            
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('rationaleSection').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'block';
            
            selectedOption = null;
            isAnswerChecked = false;
        }

        function selectOption(index) {
            if (isAnswerChecked) return;
            
            selectedOption = index;
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });
            
            document.getElementById('checkBtn').disabled = false;
        }

        function checkAnswer() {
            if (selectedOption === null) return;
            
            isAnswerChecked = true;
            const question = questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === question.correctIndex) {
                    opt.classList.add('correct');
                    opt.querySelector('.option-icon').innerHTML = '✓';
                    opt.querySelector('.option-icon').style.color = '#48bb78';
                } else if (i === selectedOption && i !== question.correctIndex) {
                    opt.classList.add('incorrect');
                    opt.querySelector('.option-icon').innerHTML = '✗';
                    opt.querySelector('.option-icon').style.color = '#f56565';
                }
            });
            
            if (selectedOption === question.correctIndex) {
                score++;
                streak++;
                updateStreak();
            } else {
                streak = 0;
                updateStreak();
            }
            
            document.getElementById('rationaleText').textContent = question.rationale;
            document.getElementById('rationaleSection').style.display = 'block';
            document.getElementById('checkBtn').style.display = 'none';
        }

        function updateStreak() {
            const streakCounter = document.getElementById('streakCounter');
            const streakCount = document.getElementById('streakCount');
            
            if (streak >= 3) {
                streakCounter.classList.add('active');
                streakCount.textContent = streak;
            } else {
                streakCounter.classList.remove('active');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex >= questions.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
            document.getElementById('scoreMessage').textContent = getScoreMessage();
            
            if (score >= questions.length * 0.7) {
                createConfetti();
            }
        }

        function getScoreMessage() {
            const percentage = (score / questions.length) * 100;
            if (percentage === 100) return "מושלם! אתה שולט בחומר ברמה הגבוהה ביותר.";
            if (percentage >= 85) return "מצוין! אתה בהחלט מוכן למבחן.";
            if (percentage >= 70) return "טוב מאוד. חזרה קטנה על ההסברים ותהיה מוכן לגמרי.";
            if (percentage >= 55) return "ציון עובר, אבל כדאי לעבור שוב על סיכום המושגים.";
            return "לא נורא, תרגול נוסף יעשה את ההבדל! מומלץ לקרוא שוב את הסיכום.";
        }

        function createConfetti() {
            const colors = ['#f6e05e', '#667eea', '#764ba2', '#48bb78', '#f56565', '#ed8936'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.width = (Math.random() * 10 + 8) + 'px';
                confetti.style.height = (Math.random() * 10 + 8) + 'px';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            selectedOption = null;
            isAnswerChecked = false;
            score = 0;
            streak = 0;
            
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('streakCounter').classList.remove('active');
        }
    </script>
