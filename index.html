<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאסטר SPSS: הכנה למבחן בסטטיסטיקה יישומית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #0ea5e9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            margin-bottom: 40px;
        }

        .app-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .app-header p {
            margin: 0;
            font-size: 1.3rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 0 20px 60px;
        }

        .progress-bar-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .progress-track {
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary) 0%, var(--primary) 100%);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            animation: slideUp 0.5s ease-out;
            margin-bottom: 30px;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .spss-container {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 20px;
            margin: 25px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            direction: ltr; 
            text-align: left;
            overflow-x: auto;
            border-radius: 8px;
        }

        .spss-title {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            color: #000;
        }

        .spss-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #000;
            min-width: 600px;
        }

        .spss-table th, .spss-table td {
            padding: 6px 10px;
            text-align: right;
        }

        .spss-table th {
            border-top: 2px solid #000;
            border-bottom: 1px solid #000;
            font-weight: bold;
            vertical-align: bottom;
        }

        .spss-table .row-header {
            text-align: left;
            font-weight: normal;
        }

        .spss-table tbody tr:last-child td {
            border-bottom: 2px solid #000;
        }

        .spss-footer {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333;
            margin-top: 10px;
        }

        .options-grid {
            display: grid;
            gap: 16px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: right;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .option-btn:hover:not(:disabled) {
            border-color: #94a3b8;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .option-btn.correct {
            background: var(--success-light);
            border-color: var(--success);
            color: #064e3b;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .option-btn.wrong {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #7f1d1d;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
            opacity: 0.7;
        }

        .option-btn:disabled {
            cursor: default;
            transform: none;
        }

        .feedback-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            animation: slideUp 0.4s ease-out;
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .feedback-box h4 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-box.correct-feedback {
            display: block;
            background: #ecfdf5;
            border-right: 6px solid var(--success);
            color: #064e3b;
        }

        .feedback-box.wrong-feedback {
            display: block;
            background: #fef2f2;
            border-right: 6px solid var(--danger);
            color: #7f1d1d;
        }

        .correct-answer-highlight {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--danger);
            margin: 10px 0;
            font-weight: 700;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 30px;
        }

        .btn-next {
            display: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(79, 70, 229, 0.35);
        }

        #resultsScreen {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            border: 10px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 0 auto 30px;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.2);
            position: relative;
        }

        @media (max-width: 768px) {
            .card { padding: 25px; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 1.1rem; padding: 15px; }
            .app-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>מאסטר SPSS</h1>
        <p>זיהוי וניתוח טבלאות - ממוקד למבחן</p>
    </header>

    <div class="container">
        
        <div id="quizScreen">
            <div class="progress-bar-container">
                <div class="progress-info">
                    <span id="progressText">שאלה 1 מתוך X</span>
                    <span id="scoreTracker">הצלחות: 0</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="card" id="questionCard">
                <div class="question-text" id="questionText">טוען שאלה...</div>
                <div id="tableContainer"></div>
                
                <div class="options-grid" id="optionsGrid">
                    <!-- Options injected via JS -->
                </div>

                <div id="feedbackBox" class="feedback-box">
                    <!-- Feedback injected via JS -->
                </div>

                <div class="action-container">
                    <button class="btn-next" id="btnNext" onclick="nextQuestion()">לשאלה הבאה ❯</button>
                </div>
            </div>
        </div>

        <div id="resultsScreen" class="card">
            <h2>סיום המבחן!</h2>
            <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">הנה התוצאה הסופית שלך:</p>
            <div class="score-circle" id="finalScore">0%</div>
            <h3 id="finalMessage" style="font-size: 1.8rem; margin-bottom: 40px; color: var(--text-dark);"></h3>
            <button class="btn-next" style="display: inline-block;" onclick="location.reload()">↻ התחל תרגול מחדש</button>
        </div>

    </div>

    <script>
        // Data Set: 28 strictly table/output-based questions, no direct naming of tests.
        const questions = [
            {
                q: "חוקר ביצע ניתוח סטטיסטי והתקבל הפלט שלפניך. מה המסקנה הסטטיסטית העולה מטבלה זו?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Chi-Square Tests</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th>Value</th><th>df</th><th>Asymp. Sig. (2-sided)</th></tr>
                    </thead>
                    <tbody>
                      <tr><td class="row-header">Pearson Chi-Square</td><td>14.321<sup>a</sup></td><td>2</td><td>.001</td></tr>
                      <tr><td class="row-header">N of Valid Cases</td><td>350</td><td></td><td></td></tr>
                    </tbody>
                  </table>
                  <div class="spss-footer">a. 0 cells (0.0%) have expected count less than 5.</div>
                </div>
                `,
                options: [
                    "לא ניתן לדחות את השערת האפס כי אין מספיק נתונים.",
                    "לא דוחים את השערת האפס. המודל אינו מסביר כלל שונות (0.001).",
                    "דוחים את השערת האפס, קיים קשר מובהק בין המשתנים.",
                    "ההבדל בין הממוצעים של הקבוצות מובהק ברמת מובהקות של 0.05."
                ],
                ans: 2,
                exp: "איתור הפלט: זוהי טבלת חי-בריבוע. מסתכלים על השורה Pearson Chi-Square ועמודת ה-Sig. המספר 0.001 קטן מ-0.05, לכן דוחים את השערת האפס ומסיקים שקיים קשר מובהק בין המשתנים."
            },
            {
                q: "לפניך טבלה מתוך פלט של SPSS. מה מייצג המספר 0.552, ומה ניתן להסיק ממנו?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Model Summary</div>
                  <table class="spss-table">
                    <thead><tr><th>Model</th><th>R</th><th>R Square</th><th>Adjusted R Square</th><th>Std. Error of the Estimate</th></tr></thead>
                    <tbody><tr><td>1</td><td>.743<sup>a</sup></td><td>.552</td><td>.549</td><td>1.230</td></tr></tbody>
                  </table>
                </div>
                `,
                options: [
                    "זהו אחוז התאים שקטן מ-5, המבחן לא תקין.",
                    "המודל (המשתנים המסבירים) מצליח להסביר 55.2% מהשונות של המשתנה התלוי.",
                    "המובהקות של המודל היא 0.552, ולכן המודל אינו מובהק כלל.",
                    "ישנה מהימנות פנימית ברמה בינונית לשאלון."
                ],
                ans: 1,
                exp: "איתור הפלט: טבלת Model Summary מופיעה במבחן הרגרסיה. עמודת R Square מתארת את אחוז השונות המוסברת. 0.552 פירושו שהמודל מסביר 55.2% מהשונות של המשתנה התלוי."
            },
            {
                q: "חוקר קיבל את הפלט הבא. איזה מבין שני המשתנים המסבירים (שכר או גיל) תורם בצורה חזקה יותר למודל, והאם יש לכלול את שניהם?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Coefficients<sup>a</sup></div>
                  <table class="spss-table">
                    <thead>
                      <tr><th>Model</th><th></th><th colspan="2" style="text-align:center;">Unstandardized Coefficients</th><th>Standardized Coefficients</th><th>t</th><th>Sig.</th></tr>
                      <tr><th></th><th></th><th>B</th><th>Std. Error</th><th>Beta</th><th></th><th></th></tr>
                    </thead>
                    <tbody>
                      <tr><td>1</td><td class="row-header">(Constant)</td><td>12.500</td><td>3.100</td><td></td><td>4.032</td><td>.000</td></tr>
                      <tr><td></td><td class="row-header">Salary</td><td>0.005</td><td>0.001</td><td>.480</td><td>5.000</td><td>.000</td></tr>
                      <tr><td></td><td class="row-header">Age</td><td>0.120</td><td>0.080</td><td>.150</td><td>1.500</td><td>.138</td></tr>
                    </tbody>
                  </table>
                </div>
                `,
                options: [
                    "הגיל חזק יותר (כי 0.120 גדול מ-0.005). יש לכלול את שניהם.",
                    "השכר חזק יותר (לפי Beta של .480), אך יש למחוק את משתנה הגיל מכיוון שהוא אינו מובהק (.138).",
                    "שניהם חזקים באותה מידה ושניהם מובהקים בגלל הקבוע.",
                    "השכר חזק יותר ויש לכלול את שניהם כי שניהם חיוביים."
                ],
                ans: 1,
                exp: "איתור הפלט: רגרסיה. עוצמה נמדדת ב-Beta (שכר=0.480, גיל=0.150, לכן שכר חזק יותר). אולם, ה-Sig של גיל הוא 0.138 (גדול מ-0.05). משמע הוא אינו מובהק, ואין לכלול אותו במודל!"
            },
            {
                q: "מה נמליץ לחוקר לעשות בהתבסס על הפלט שלפניך?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Item-Total Statistics</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th>Corrected Item-Total Correlation</th><th>Cronbach's Alpha if Item Deleted</th></tr>
                    </thead>
                    <tbody>
                      <tr><td class="row-header">Question_1</td><td>.620</td><td>.710</td></tr>
                      <tr><td class="row-header">Question_2</td><td>.150</td><td>.890</td></tr>
                      <tr><td class="row-header">Question_3</td><td>.580</td><td>.725</td></tr>
                    </tbody>
                  </table>
                  <div class="spss-footer">Overall Alpha = .740</div>
                </div>
                `,
                options: [
                    "למחוק את כל השאלות, כי המהימנות גרועה.",
                    "לשמור את השאלון כמו שהוא, המהימנות מצוינת ואין לשנות דבר.",
                    "למחוק את Question_2, מכיוון שהסרתה תעלה את המהימנות הכוללת מ-.740 ל-.890.",
                    "למחוק את Question_1 כי ה-Alpha שלה (.710) הוא הנמוך ביותר."
                ],
                ans: 2,
                exp: "איתור הפלט: בדיקת מהימנות (עקיבות פנימית). עמודת 'Alpha if Item Deleted' מראה מה יקרה אם נמחק את הפריט. אם נמחק את שאלה 2, האלפא תקפוץ מ-0.740 ל-0.890. לכן, הפריט פוגע בשאלון ומומלץ למחוק אותו."
            },
            {
                q: "מתוך הפלט הבא, על איזו שורת תוצאות יש להסתכל (העליונה או התחתונה), ומהי המסקנה הסופית לגבי ההבדלים בממוצעים?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">Independent Samples Test</div>
                  <table class="spss-table">
                    <thead>
                      <tr><th></th><th></th><th colspan="2" style="text-align:center; border-bottom:1px solid #000;">Levene's Test</th><th colspan="3" style="text-align:center; border-bottom:1px solid #000;">t-test for Equality of Means</th></tr>
                      <tr><th></th><th></th><th>F</th><th>Sig.</th><th>t</th><th>df</th><th>Sig. (2-tailed)</th></tr>
                    </thead>
                    <tbody>
                      <tr><td rowspan="2" style="vertical-align:top;">Score</td><td class="row-header">Equal variances assumed</td><td>8.512</td><td>.004</td><td>1.450</td><td>80</td><td>.151</td></tr>
                      <tr><td class="row-header">Equal variances not assumed</td><td></td><td></td><td>1.320</td><td>65.4</td><td>.191</td></tr>
                    </tbody>
                  </table>
                </div>
                `,
                options: [
                    "מסתכלים על השורה העליונה (השונויות שוות), והמסקנה היא שיש הבדל מובהק כי Sig=0.004.",
                    "מסתכלים על השורה התחתונה (השונויות לא שוות), והמסקנה היא שאין הבדל מובהק כי Sig=0.191.",
                    "מסתכלים על השורה העליונה, ואין הבדל מובהק כי Sig=0.151.",
                    "לא ניתן להסיק מסקנות מבלי לראות את הממוצעים תחילה."
                ],
                ans: 1,
                exp: "איתור הפלט: מבחן T למדגמים בלתי תלויים. שלב 1: מבחן לווין. ה-Sig שלו הוא 0.004 (<0.05). משמע: השונויות אינן שוות. לכן יורדים לקרוא את **השורה התחתונה**. בשורה התחתונה ה-Sig (2-tailed) של ה-t הוא 0.191. מספר זה גדול מ-0.05, לכן **לא דוחים את השערת האפס ואין הבדל מובהק**."
            },
            {
                q: "התבונן בפלט שלפניך. האם המודל המוצג בו מתאים ויכול לשמש לניבוי הנתונים באוכלוסייה?",
                table: `
                <div class="spss-container">
                  <div class="spss-title">ANOVA<sup>a</sup></div>
                  <table class="spss-table">
                    <thead><tr><th>Model</th><th></th><th>Sum of Squares</th><th>df</th><th>Mean Square</th><th>F</th><th>Sig.</th></tr></thead>
                    <tbody>
                      <tr><td>1</td><td class="row-header">Regression</td><td>25.100</td><td>2</td><td>12.550</td><td>1.250</td><td>.290<sup>b</sup></td></tr>
                      <tr><td></td><td class="row-header">Residual</td><td>850.000</td><td>85</td><td>10.000</td><td></td><td></td></tr>
                      <tr><td></td><td class="row-header">Total</td><td>875.100</td><td>87</td><td></td><td></td><td></td></tr>
                    </tbody>
                  </table>
                </div>
                `,
                options: [
                    "כן, כל עוד המשוואה מחושבת נכון מתוך ה-B.",
                    "לא, המודל אינו מובהק סטטיסטית, מכיוון שה-Sig הוא 0.290 (גדול מ-0.05).",
                    "כן, מכיוון שהמודל מסביר 25.1% מהשונות.",
                    "הטבלה הזו נועדה להשוות 3 קבוצות ולא עוסקת בניבוי."

        let currentQuestionIndex = 0;
        let score = 0;
        const userAnswers = new Array(questions.length).fill(null);

        function initQuiz() {
            renderQuestion(currentQuestionIndex);
            updateProgress();
        }

        function renderQuestion(index) {
            const q = questions[index];
            const container = document.getElementById('optionsGrid');
            
            document.getElementById('questionText').innerHTML = `שאלה ${index + 1}: ${q.q}`;
            document.getElementById('tableContainer').innerHTML = q.table ? q.table : '';
            
            let html = '';
            q.options.forEach((opt, optIndex) => {
                let btnClass = 'option-btn';
                let disabledAttr = '';
                
                if (userAnswers[index] !== null) {
                    disabledAttr = 'disabled';
                    if (optIndex === q.ans) {
                        btnClass += ' correct';
                    } else if (optIndex === userAnswers[index]) {
                        btnClass += ' wrong';
                    }
                }

                html += `
                    <button class="${btnClass}" ${disabledAttr} onclick="checkAnswer(${optIndex}, this)">
                        <div style="flex-grow:1; text-align:right;">${opt}</div>
                    </button>
                `;
            });
            
            container.innerHTML = html;

            const feedbackBox = document.getElementById('feedbackBox');
            if (userAnswers[index] !== null) {
                showFeedback(index, userAnswers[index]);
                document.getElementById('btnNext').style.display = 'inline-block';
            } else {
                feedbackBox.style.display = 'none';
                document.getElementById('btnNext').style.display = 'none';
            }

            if (index === questions.length - 1 && userAnswers[index] !== null) {
                document.getElementById('btnNext').innerText = 'סיום והצגת ציון 🏆';
            } else {
                document.getElementById('btnNext').innerText = 'לשאלה הבאה ❯';
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (userAnswers[currentQuestionIndex] !== null) return;

            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.ans;
            
            if (isCorrect) score++;

            renderQuestion(currentQuestionIndex);
            updateProgress();
        }

                    <h4><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> כל הכבוד! תשובה נכונה.</h4>
                    <p>${q.exp}</p>
                `;
            } else {
                feedbackBox.className = 'feedback-box wrong-feedback';
                feedbackBox.innerHTML = `
                    <h4><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> טעות!</h4>
                    <p>התשובה הנכונה היא:</p>
                    <div class="correct-answer-highlight">${q.options[q.ans]}</div>
                    <p><strong>למה?</strong> ${q.exp}</p>
                `;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
                updateProgress();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            document.getElementById('progressText').innerText = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
            document.getElementById('scoreTracker').innerText = `הצלחות: ${score}/${questions.length}`;
            
            const percent = ((answeredCount) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            const resultsScreen = document.getElementById('resultsScreen');
            resultsScreen.style.display = 'block';

            const percent = Math.round((score / questions.length) * 100);
            
            let currentPercent = 0;
            const scoreElement = document.getElementById('finalScore');
            const timer = setInterval(() => {
                currentPercent += 2;
                if (currentPercent >= percent) {
                    currentPercent = percent;
                    clearInterval(timer);
                }
                scoreElement.innerText = `${currentPercent}%`;
            }, 30);

            let msg = "";
            if (percent === 100) msg = "מאסטר SPSS אמיתי! 🏆<br>אתה מוכן לחלוטין למבחן.";
            else if (percent >= 80) msg = "עבודה מעולה! 🌟<br>שליטה טובה מאוד בחומר ובקריאת הפלטים.";
            else if (percent >= 60) msg = "ציון עובר 👍<br>מומלץ לחזור שוב על השאלות שטעית בהן (במיוחד קריאת טבלאות).";
            else msg = "לא נורא 💪<br>זכור את חוק ה-Sig, קרא שוב את הכללים, ותעשה את המבחן מחדש.";

            document.getElementById('finalMessage').innerHTML = msg;
        }

        // Start App
        initQuiz();
    </script>
</body>
</html>
